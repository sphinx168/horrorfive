<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>五樓</title>
<style>
:root{
  --board:#4A6D8C; --board-dark:#3A566E;
  --page:#E4E8EC; --panel:#FFFFFF;
  --line:#C0C9D2; --line-soft:#DDE3E9;
  --ink:#22282E; --ink-soft:#5C6873;
  --link:#16387C; --warm:#8C6A3A;
  --chrome:#D6D9DD;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:#9BA3AB;color:var(--ink);
  font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;
  font-size:13px;line-height:1.75}
button{font-family:inherit;cursor:pointer}

/* ===== 茶水間：一支獨立的聊天 App =====
   手機上沒有人會在瀏覽器的分頁裡聊天——聊天軟體本來就是另一支 App。
   #chatapp 因此不畫在假瀏覽器裡面，而是蓋在整個畫面上的一層：手機滿版，
   桌機停在右下角像一扇聊天視窗。收起來之後右下角留一顆 #chatdock 把它叫回來，
   新訊息則從畫面上緣以推播橫幅的樣子掉下來。 */
#chatapp{position:fixed;z-index:60;display:none;flex-direction:column;overflow:hidden;
  right:20px;bottom:0;width:352px;height:min(600px,84vh);background:#DFE3E7;
  border:1px solid #78848E;border-bottom:0;border-radius:13px 13px 0 0;
  box-shadow:0 8px 30px rgba(0,0,0,.34)}
#chatapp.on{display:flex}
/* 登入之前後面是一片空的，靠在右下角看起來像壞掉：置中成一支手機的樣子 */
#chatapp.solo{left:50%;right:auto;top:50%;bottom:auto;transform:translate(-50%,-50%);
  width:min(400px,92vw);height:min(660px,86vh);border:1px solid #78848E;border-radius:13px}
.ca-top{flex:none;display:flex;align-items:center;gap:9px;color:#fff;background:#2F5468;
  padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.ca-back{flex:none;background:none;border:0;color:#fff;font-size:21px;line-height:1;
  padding:1px 6px 3px;opacity:.85}
.ca-back:hover{opacity:1}
/* 登入之前本來沒有「上一個畫面」可以回去；等冠廷那個連結把登入頁叫出來之後就有了
   （.hasback），因為問密碼那段要能在登入頁和茶水間之間來回走。 */
#chatapp.solo:not(.hasback) .ca-back{display:none}
.ca-av{flex:none;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.16);
  display:flex;align-items:center;justify-content:center;font-size:13px;
  font-family:"MingLiU","SimSun",serif}
.ca-ttl{min-width:0;font-size:14px;font-weight:600;line-height:1.4}
.ca-ttl .sub{display:block;font-weight:400;font-size:11px;opacity:.7;margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-msgs{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;padding:14px 12px;display:flex;flex-direction:column}
/* 訊息貼著下緣長上來（margin-top:auto，而不是 justify-content:flex-end——
   後者在訊息長到滿出來之後會捲不回最上面） */
.pl-stack{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.pl-row{display:flex;align-items:flex-end;gap:7px;max-width:88%}
.pl-row.other{align-self:flex-start}
.pl-row.me{align-self:flex-end;flex-direction:row-reverse}
.pl-av{width:26px;height:26px;border-radius:50%;flex:none;color:#fff;font-size:11px;
  display:flex;align-items:center;justify-content:center;font-weight:600}
.pl-col{display:flex;flex-direction:column;min-width:0}
.pl-row.other .pl-col{align-items:flex-start}
.pl-row.me .pl-col{align-items:flex-end}
.pl-name{font-size:11px;color:var(--ink-soft);margin:0 3px 3px}
/* 同一個人連著講的第二句以後：頭像留著位子但不畫，名字整個省掉 */
.pl-row.cont{margin-top:-4px}
.pl-row.cont .pl-av{visibility:hidden}
.pl-row.cont .pl-name{display:none}
.pl-bub{padding:8px 12px;border-radius:15px;font-size:13px;line-height:1.6;white-space:pre-wrap}
.pl-row.other .pl-bub{background:#EEF0F2;color:var(--ink);border-bottom-left-radius:4px}
.pl-row.me .pl-bub{background:var(--board);color:#fff;border-bottom-right-radius:4px}
.pl-typing .pl-bub{padding:11px 14px;display:flex;gap:3px;align-items:center}
.pl-typing .dot{width:6px;height:6px;border-radius:50%;background:#9AA4AD;
  animation:pldot 1.1s infinite ease-in-out}
.pl-typing .dot:nth-child(2){animation-delay:.15s}
.pl-typing .dot:nth-child(3){animation-delay:.3s}
@keyframes pldot{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}
.pl-link{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:13px;
  border:1px solid var(--line);background:#FAFBFC;color:var(--link);font-size:12px;
  border-bottom-right-radius:4px}
.pl-link:hover{background:#F0F3F6}
.pl-link .lbl{display:block;color:var(--ink-soft);font-size:11px;margin-bottom:3px}
.pl-link .url{font-family:"Courier New",monospace}
.pl-row.me .pl-draft{cursor:pointer;border:1px dashed rgba(255,255,255,.7);
  background:var(--board);opacity:.55;font-family:inherit;text-align:left}
.pl-row.me .pl-draft:hover{opacity:.8}
.pl-pick{align-self:flex-end;max-width:92%;display:flex;flex-direction:column;
  align-items:flex-end;gap:6px;margin-top:2px}
.pl-pick .pk-t{font-size:11px;color:var(--ink-soft);margin-right:3px}
.pl-pick .pk-o{padding:8px 12px;border-radius:15px;border:1px dashed var(--board);
  background:#fff;color:var(--board-dark);font-size:13px;line-height:1.6;
  text-align:right;cursor:pointer;font-family:inherit;max-width:100%}
.pl-pick .pk-o:hover{background:var(--board);color:#fff;border-style:solid}
.pl-sys{align-self:center;max-width:92%;text-align:center;padding:3px 10px;
  font-size:11px;color:#98A3AD;letter-spacing:.06em;line-height:1.7}
.pl-row.other .pl-link{border-bottom-left-radius:4px;border-bottom-right-radius:13px}
.pl-link .tt{display:block;color:var(--ink);font-size:12.5px;margin-bottom:2px}

/* 輸入列：平常是一條按不下去的假輸入框，輪到她講話時整條換成送出提示 */
.pl-in{flex:none;display:flex;align-items:center;gap:8px;padding:9px 12px;background:#F1F4F6;
  border-top:1px solid #C9D0D6;font-size:12.5px;color:#A2AAB2;
  padding-bottom:calc(9px + env(safe-area-inset-bottom,0px))}
.pl-in .fld{flex:1;min-width:0;padding:6px 12px;border-radius:14px;background:#fff;
  border:1px solid #D3DAE0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-in .snd{flex:none;color:#B0B8BF}
.pl-in.act{justify-content:flex-end;color:var(--board);font-weight:600}
  /* 提示靠右，那個↑才指得到右邊的草稿泡泡 */

/* 把茶水間叫回來的那顆浮球（App 收起來的時候才在） */
#chatdock{position:fixed;z-index:55;right:16px;width:54px;height:54px;border-radius:50%;
  bottom:calc(16px + env(safe-area-inset-bottom,0px));
  background:#2F5468;color:#fff;border:0;box-shadow:0 4px 15px rgba(0,0,0,.33);
  display:flex;align-items:center;justify-content:center;font-size:18px;
  font-family:"MingLiU","SimSun",serif}
#chatdock[hidden]{display:none}
#chatdock .bd{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;
  border-radius:10px;background:#B03A3A;border:2px solid #9BA3AB;color:#fff;
  font-family:"Courier New",monospace;font-size:11px;line-height:1;
  display:flex;align-items:center;justify-content:center}
#chatdock.un{animation:dockpulse 2s ease-in-out infinite}
@keyframes dockpulse{0%,100%{box-shadow:0 4px 15px rgba(0,0,0,.33)}
  50%{box-shadow:0 4px 15px rgba(0,0,0,.33),0 0 0 9px rgba(47,84,104,.15)}}

/* 推播橫幅：人不在茶水間的時候，新訊息從畫面上緣掉下來 */
.toast{position:fixed;z-index:70;right:16px;width:288px;cursor:pointer;display:flex;
  align-items:center;gap:10px;top:calc(12px + env(safe-area-inset-top,0px));
  background:rgba(34,40,46,.96);color:#EDF1F4;border-radius:14px;padding:10px 13px;
  line-height:1.55;box-shadow:0 8px 24px rgba(0,0,0,.36);animation:banner .34s ease}
.toast[hidden]{display:none}
.toast .ic{flex:none;width:27px;height:27px;border-radius:8px;background:#2F5468;
  display:flex;align-items:center;justify-content:center;font-size:13px;
  font-family:"MingLiU","SimSun",serif}
.toast .t{display:block;font-size:12.5px;font-weight:600}
.toast .s{font-size:11px;color:#A9B4BE}
@keyframes banner{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#chatdock.un{animation:none}
  .toast{animation:none}}

/* ===== 登入 ===== */
#login{display:none;max-width:330px;margin:14vh auto 0;padding:0 16px}
.brand{font-family:"MingLiU","SimSun","Songti TC",serif;font-size:50px;letter-spacing:.22em;
  color:#2C3E50;text-align:center;margin:0 0 2px;text-indent:.22em}
.brand-sub{text-align:center;color:#5C6873;font-size:11px;letter-spacing:.3em;
  text-indent:.3em;margin-bottom:24px}
.loginbox{background:var(--panel);border:1px solid var(--line);padding:20px 18px 18px}
.loginbox label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:4px}
.loginbox input{width:100%;padding:7px 8px;margin-bottom:13px;border:1px solid var(--line);
  background:#FCFDFD;font-family:"Courier New",monospace;font-size:14px;color:var(--ink)}
.loginbox input:focus{outline:2px solid var(--board);outline-offset:-1px}
.loginbox input[readonly]{color:var(--ink-soft);background:#EEF1F3;cursor:default}
.btn{padding:8px 18px;background:var(--board);color:#fff;border:1px solid var(--board-dark);
  font-size:13px;letter-spacing:.08em}
.btn:hover{background:var(--board-dark)}
.btn.wide{width:100%}
.btn:disabled{background:#A8B2BB;border-color:#98A3AD;cursor:default}
.loginerr{color:#8C3A3A;font-size:12px;min-height:20px;margin-top:9px;text-align:center}
.footnote{text-align:center;color:#4A5560;font-size:11px;margin-top:20px;line-height:2}

/* ===== 瀏覽器外殼 ===== */
/* 分頁列與網址列是「瀏覽器外框」，捲的是框裡的網頁：外殼吃滿一個螢幕高，
   tabstrip／omni 固定不動，只有 .viewport 自己捲。 */
#browser{display:none;flex-direction:column;max-width:980px;margin:0 auto;
  height:100vh;height:100dvh;
  background:var(--chrome);box-shadow:0 0 0 1px #8A9299}
.tabstrip{flex:none;display:flex;align-items:flex-end;gap:1px;padding:6px 8px 0;
  background:#B9BEC4;overflow-x:auto}
.tab{display:flex;align-items:center;gap:6px;padding:6px 10px 7px;min-width:104px;max-width:220px;
  background:#C6CBD0;border:1px solid #A6ADB4;border-bottom:0;border-radius:5px 5px 0 0;
  font-size:12px;color:#3A424A;white-space:nowrap;flex:none}
.tab:hover{background:#CFD4D9}
.tab.on{background:var(--chrome);border-color:#8A9299;padding-bottom:8px;margin-bottom:-1px;z-index:2}
.tab .fav{width:11px;height:11px;flex:none;border-radius:2px}
.tab .tt{overflow:hidden;text-overflow:ellipsis}
.tab .cl{margin-left:auto;background:none;border:0;color:#6E7A85;font-size:12px;padding:0 2px;line-height:1}
.omni{flex:none;display:flex;align-items:center;gap:8px;padding:7px 10px;
  background:var(--chrome);border-bottom:1px solid #A6ADB4}
.omni .navb button{background:none;border:0;color:#6E7A85;font-size:14px;padding:1px 5px}
.omni .navb button:disabled{color:#B0B7BE;cursor:default}
.omni .url{flex:1;min-width:0;background:#fff;border:1px solid #A6ADB4;border-radius:2px;
  padding:4px 9px;font-family:"Courier New",monospace;font-size:12px;color:#3A424A;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.omni .url .sec{color:#8A9299}
.viewport{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;padding:14px 12px 40px}

/* ===== 五樓 ===== */
.vp-wulou{background:var(--page);
  background-image:repeating-linear-gradient(180deg,rgba(0,0,0,.012) 0 1px,transparent 1px 4px)}
.pg{max-width:800px;margin:0 auto}
.wl-hd{background:var(--board);color:#fff;padding:8px 12px;display:flex;
  align-items:baseline;gap:12px;flex-wrap:wrap}
.wl-hd .lg{font-family:"MingLiU","SimSun",serif;font-size:18px;letter-spacing:.18em}
.wl-hd .nv{font-size:11px;opacity:.72;letter-spacing:.08em}
.wl-hd .nv button{background:none;border:0;padding:0;color:inherit;font:inherit;
  letter-spacing:inherit;cursor:pointer;opacity:1}
.wl-hd .nv button:hover{text-decoration:underline}
.wl-hd .me{margin-left:auto;font-size:11px;opacity:.9}
.wl-sub{background:#D5DCE3;border:1px solid var(--line);border-top:0;padding:4px 12px;
  font-size:11px;color:var(--ink-soft)}
.wl-body{background:#fff;border:1px solid var(--line);border-top:0;padding:12px 14px}
.wl-title{font-size:15px;font-weight:600;margin-bottom:2px}
.wl-meta{font-size:11px;color:var(--ink-soft);margin-bottom:12px;
  border-bottom:1px solid var(--line-soft);padding-bottom:8px}
.rp{display:flex;gap:10px;padding:7px 0;border-bottom:1px dotted #E3E8EC}
.rp:last-child{border-bottom:0}
.rp .f{width:52px;flex:none;padding-left:5px;font-family:"Courier New",monospace;
  font-size:11px;color:#98A3AD}
.rp .u{width:100px;flex:none;font-size:11px;line-height:1.4;padding-top:1px}
.rp .u .nm{display:block;font-size:12.5px;color:var(--ink)}
.rp .u .uid{display:block;font-size:9.5px;color:#A2AAB2;font-family:"Courier New",monospace}
.rp .c{flex:1;font-family:"MingLiU","SimSun",serif;font-size:14px;white-space:pre-wrap;line-height:1.9}
.rp.del .c{font-style:italic;color:#A2A9AF;font-family:inherit;font-size:12px}
.rp.mine{background:#EEF3F8;box-shadow:inset 3px 0 0 var(--board)}
.rp.mine .u .nm{font-weight:700;color:var(--board-dark)}
.rp.mine .u .me{font-weight:400;font-size:9px;color:var(--board-dark);margin-left:2px}
.rp.restored{background:#FBF7EF;box-shadow:inset 3px 0 0 var(--warm)}
.rp.restored .u::after{content:'　已還原';font-size:9px;color:var(--warm);font-weight:400}
.wl-lock{padding:34px 10px;text-align:center;font-size:12.5px;color:var(--ink-soft);
  line-height:2.1;white-space:pre-wrap;border:1px dashed #C8D0D7;margin:10px 0;
  background:#F7F9FA}
.idx-row .lk{margin-right:5px;font-size:11px;opacity:.7}
.rp .rlog{margin-top:5px;font-size:10.5px;color:var(--warm);
  font-family:"Courier New",monospace;letter-spacing:.02em}
.rp .t{width:78px;flex:none;text-align:right;font-size:10px;color:#98A3AD;
  font-family:"Courier New",monospace;padding-top:3px;white-space:nowrap}
.silence{text-align:center;font-size:11px;color:#A2A9AF;padding:10px 0;letter-spacing:.12em;
  font-family:"Courier New",monospace}

/* 板首頁 */
.idx-list{padding:2px 0}
.idx-row{display:block;width:100%;text-align:left;background:none;border:0;
  border-bottom:1px solid var(--line-soft);padding:9px 4px;font-size:13px}
.idx-row:last-child{border-bottom:0}
.idx-row .t{color:var(--link);text-decoration:underline}
.idx-row .m{font-size:11px;color:#98A3AD;font-family:"Courier New",monospace;margin-top:2px;
  white-space:pre}
.idx-row:hover{background:#F4F8FB}
.idx-row.new .t::after{content:'　new';color:#8C3A3A;font-size:9px;text-decoration:none}
.idx-row.deco{cursor:default;opacity:.6}
.idx-row.deco:hover{background:none}
.idx-row.deco .t{color:var(--ink);text-decoration:none}
/* filler：跟裝飾串一樣灰、一樣沒有 new 標籤，但按得下去——
   讓玩家分得出「這是背景閒聊」而不是線索，點了也不會撲空 */
.idx-row.filler{opacity:.75}
.idx-row.filler .t{color:var(--ink);text-decoration:none}
/* 置頂公告：跟 filler 一樣低調，只是標題前面多一個置頂記號 */
.idx-row.top .t::before{content:'置頂　';color:#8C3A3A;font-size:9px;text-decoration:none}

/* 分頁列：舊板就算只有一頁也會把它印出來 */
.wl-pager{display:flex;align-items:center;justify-content:center;gap:5px;flex-wrap:wrap;
  padding:14px 0 4px;font-size:11px;color:var(--ink-soft);font-family:"Courier New",monospace}
.wl-pager button{background:none;border:1px solid var(--line-soft);color:var(--link);
  padding:2px 8px;font-size:11px;font-family:inherit;cursor:pointer}
.wl-pager button:hover:not([disabled]){background:#F4F8FB}
.wl-pager button[disabled]{color:#BFC6CC;border-color:#EDF0F3;cursor:default}
.wl-pager .p.on{background:#EEF3F8;color:var(--ink);font-weight:700;border-color:var(--line)}
.wl-pager .tot{margin-left:4px}

/* 免費空間自動插在頁首的廣告條——2015 年的免費空間都會塞這個 */
.wl-ad{display:flex;align-items:center;gap:8px;margin-bottom:6px;padding:5px 9px;
  border:1px solid #D9B84A;background:linear-gradient(#FFFBE6,#FFEFB0);
  font-size:11px;color:#7A5A00}
.wl-ad .tag{border:1px solid #D9B84A;background:#fff;padding:0 4px;font-size:9px;flex:none}
.wl-ad .txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-weight:700}
.wl-ad .x{background:none;border:0;color:#A08340;font-size:12px;line-height:1;padding:0 2px;
  flex:none;cursor:pointer}

/* 站尾：訪客計數器、Powered by、免費空間宣告 */
.wl-foot{margin-top:8px;padding:9px 4px 2px;font-size:10.5px;line-height:1.95;
  color:#98A3AD;text-align:center;font-family:"Courier New",monospace}
.wl-foot .led{margin-left:6px;background:#1C1F23;color:#7FD4A8;padding:1px 6px;
  letter-spacing:.3em}
.wl-foot .pw{color:#B4BBC1}

/* ===== Yahoo 信箱 ===== */
.vp-yahoo{background:#fff;padding:0}
.yh-top{background:#7B0099;color:#fff;padding:9px 14px;display:flex;align-items:center;gap:12px}
.yh-top .lg{font-size:19px;font-weight:700}
.yh-top .lg em{font-style:normal;color:#FFD9FF}
.yh-top .acct{margin-left:auto;font-size:11px;opacity:.85}
.yh-bar{background:#F1E4F7;border-bottom:1px solid #D9BEE6;padding:5px 14px;
  font-size:11px;color:#5C3A6B}
.yh-wrap{display:flex;min-height:60vh}
.yh-side{width:150px;flex:none;background:#FAF4FC;border-right:1px solid #E4D2EC;padding:10px 0}
.yh-side .f{padding:5px 14px;font-size:12px;color:#4A2B57}
.yh-side .f.on{background:#E9D4F2;font-weight:600}
.yh-main{flex:1;min-width:0;padding:14px 18px}
@media(max-width:700px){.yh-wrap{display:block}.yh-side{width:auto;display:flex;flex-wrap:wrap;
  border-right:0;border-bottom:1px solid #E4D2EC}}
.yh-subj{font-size:17px;color:#2B1533;margin-bottom:10px}
.mhead{font-size:12px;line-height:1.95;border-top:1px solid #E4D2EC;border-bottom:1px solid #E4D2EC;
  padding:9px 0;margin-bottom:14px;color:#4A3A52}
.mhead b{color:#7B0099;display:inline-block;width:52px}
.mbody{font-family:"MingLiU","SimSun",serif;font-size:14.5px;line-height:2.05;white-space:pre-wrap}
.yh-side .f{cursor:pointer;display:flex;align-items:center}
.yh-side .f .n{margin-left:auto;color:#8A6B99;font-size:11px}
.yh-side .f:hover{background:#F3E8F8}
.yh-listhd{font-size:13px;color:#5C3A6B;border-bottom:1px solid #E4D2EC;
  padding-bottom:7px;margin-bottom:4px;letter-spacing:.06em}
.yh-list{width:100%;border-collapse:collapse;font-size:13px}

/* ===== 手機／窄螢幕 =====
   固定寬的樓層欄（52px）＋暱稱欄（100px）＋時間欄（78px）在手機上會把內文擠成
   一行三、四個字。窄螢幕改成上下兩段：樓層／暱稱／時間縮成一條標頭，內文自己佔一整行。 */
@media(max-width:600px){
  .viewport{padding:10px 6px 34px}
  .tabstrip{padding:5px 4px 0}
  .tab{min-width:0;max-width:46vw;padding:6px 8px 7px;font-size:11px;gap:5px}
  .omni{padding:6px 7px;gap:6px}

  /* 手機上茶水間就是一支滿版的 App，不是角落的小視窗 */
  #chatapp,#chatapp.solo{left:0;right:0;top:0;bottom:0;width:auto;height:auto;
    transform:none;border:0;border-radius:0;box-shadow:none}
  .pl-row{max-width:84%}
  .pl-bub{font-size:14.5px;padding:9px 13px}
  .pl-name{font-size:11.5px}
  .pl-sys{font-size:11.5px}
  .pl-link{font-size:13px}
  .pl-link .tt{font-size:13.5px}
  .pl-in{font-size:13px}
  .toast{left:10px;right:10px;width:auto}

  .wl-hd{padding:7px 10px;gap:4px 10px}
  .wl-hd .me{margin-left:0;width:100%}
  .wl-sub{padding:4px 10px}
  .wl-body{padding:12px 10px}
  /* 板首頁那一行是 white-space:pre，之後補新串時萬一更長，寧可切掉也不要把整頁撐寬 */
  .idx-row .m{overflow:hidden;text-overflow:ellipsis}

  .rp{display:grid;grid-template-columns:auto minmax(0,1fr) auto;
    grid-template-areas:"f u t" "c c c";gap:0 8px;padding:9px 0 10px 8px}
  .rp .f{grid-area:f;width:auto;padding-left:0;line-height:1.6}
  .rp .u{grid-area:u;width:auto;padding-top:0;line-height:1.6;
    display:flex;align-items:baseline;flex-wrap:wrap;gap:0 6px}
  .rp .u .nm,.rp .u .uid{display:inline}
  .rp .t{grid-area:t;width:auto;padding-top:0;line-height:1.6}
  .rp .c{grid-area:c;font-size:15px;line-height:1.95;margin-top:4px}
  .rp.del .c{font-size:13px}
  .rp.restored .u::after{content:'已還原'}

  /* 板首頁那行「最後回覆…」是等寬對齊排的，窄螢幕讓它折行而不是撐破版面 */
  .idx-row .m{white-space:pre-wrap;word-break:break-word}

  .ar{padding:14px 12px}
  .ar .foot{word-break:break-all}
  .yh-main{padding:12px 12px}
  .yh-list .fr{width:74px}
  .yh-list .dt{width:66px}
  .mhead b{width:44px}
  .sc{padding:16px 10px 40px}

  .pl-pick .pk-o{font-size:14px}
  .bl{padding:20px 14px 44px}
  .nt{padding:20px 14px 44px}
  .said{padding:16vh 18px 22vh}
  .end{padding:12vh 18px 16vh}
  .ad .in{padding:14px 12px}
}

/* ===== 手機上點輸入框不要把整頁放大 =====
   iOS Safari 只要輸入框的字級小於 16px，一點進去就自動把頁面放大，而且打完字
   離開輸入框也不會縮回來——版面的左右邊緣就這樣被切掉。所有打得了字的欄位

   16px，放大就不會被觸發；桌機維持原本的字級。 */
@media(pointer:coarse){
  .loginbox input,.form input,.se input{font-size:16px}
}

<body>

<!-- 茶水間：整場遊戲從頭到尾都是同一支 App、同一份訊息列。
     登入前佔滿畫面，登入後浮在假瀏覽器上面，收起來就變成右下角那顆浮球。 -->
<div id="chatapp" class="on solo">
  <div class="ca-top">
    <button class="ca-back" id="caBack" title="收起茶水間">‹</button>
    <div class="ca-av">茶</div>
    <div class="ca-ttl" id="caTtl"></div>
  </div>
  <div class="pl-msgs" id="plMsgs"></div>
  <div class="pl-in" id="plIn"></div>
</div>
<button id="chatdock" hidden aria-label="茶水間"></button>
<div class="toast" id="toast" hidden></div>

<div id="login">
  <div class="brand">五樓</div>
  <div class="brand-sub">EST. 2015</div>
  <div class="loginbox">
    <!-- 帳號是這台機器十一年前就記住的，密碼沒有：她得自己想起來，
         想不起來就只剩「忘記密碼」那個她自己當年寫的提示。 -->
    <label for="u">帳號</label><input id="u" autocomplete="off" spellcheck="false"
      value="siyu_1120" readonly>
    <label class="remember"><input type="checkbox" checked disabled>記住我的帳號</label>
    <label for="p">密碼</label><input id="p" type="password" autocomplete="off" spellcheck="false">
    <button type="button" class="linklike" id="lforgot">忘記密碼？</button>
    <div class="hintq" id="lhint" hidden><div class="hintq-t">密碼提示問題</div>
      <div class="hintq-q">我的生日</div></div>
    <button class="btn wide" id="go">登入</button>
    <div class="loginerr" id="lerr"></div>
  </div>
  <div class="footnote">本板不開放註冊　│　目前 6 個帳號<br>上次登入：3618 天前</div>
</div>

<div id="dev" hidden><button id="devTab">DEV</button><div id="devPanel" hidden></div></div>

<div id="browser">
  <div class="tabstrip" id="tabstrip"></div>
  <div class="omni">
    <span class="navb">
      <button id="navBack">◀</button>
      <button id="navFwd" disabled>▶</button>
      <button id="navRel">⟳</button>
    </span>
    <span class="url" id="omniUrl"></span>
  </div>
  <div class="viewport" id="viewport"></div>
</div>

<script>
"use strict";
const TODAY=new Date(2026,10,27);   /* 故事就發生在 11/27 那天；寫死，不跟系統日期漂移 */
const fmt=d=>`${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const T=s=>String(s??'').replace(/__TODAY__/g,fmt(TODAY));
function norm(s){return (s||'')
  .replace(/[\uFF01-\uFF5E]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
  .replace(/[\s\u3000:：\-—–_.,、。／/()（）]/g,'').toLowerCase().trim();}
const match=(v,l)=>{const n=norm(v);return n.length>0&&l.some(a=>norm(a)===n);};

function syncTabs(){
  const keep=tabs.filter(t=>t.kind==='doc'&&!isBoardDoc(t.id)
    &&prog>=(DOCS.find(d=>d.id===t.id)||{at:99}).at);
  /* 茶水間不在這排分頁裡：它是另一支 App（#chatapp），不是瀏覽器的一頁 */
  tabs=[{id:boardTab,kind:'board'}].concat(keep);
  const g=curGate();
  /* 閘的分頁不能比劇情早出現：g_mail 要等序章那段演完（她自己說「那時候的信
     我信箱應該還留著」）才掛上去，否則玩家一登入就看到一個 Yahoo 登入頁，
     還能直接跳過整個序章去解謎。其他關要比照辦理，加 needChat 即可。 */
  const gateReady=g&&(!g.needChat||chatDone.has(g.needChat));
  if(g&&gateReady&&!gateDone[g.id]) tabs.splice(1,0,{id:g.id,kind:'gate'});
  if(NOTES_TAB_ENABLED) tabs.splice(g&&gateReady&&!gateDone[g.id]?2:1,0,{id:'notes',kind:'notes'});
  if(prog>=6) tabs=[{id:'end',kind:'end'}];
  if(!tabs.some(t=>t.id===active)) active=boardTab;
}
function openTab(id){
  if(!tabs.some(t=>t.id===id)){
    const docs=tabs.filter(t=>t.kind==='doc');
    if(docs.length>=MAX_DOC_TABS){
      const oldest=docs[0].id;
      tabs=tabs.filter(t=>t.id!==oldest);
      hist=hist.filter(h=>h!==oldest);
    }
    tabs.push({id,kind:'doc'});
  }
  go(id);
}
/* 開啟一份文件：五樓站內的串（含首頁）留在同一個分頁切換，其他站台才開新分頁 */
function openDoc(id){
  seen.add(id);
  if(isBoardDoc(id)){ boardTab=id; go(id); }
  else openTab(id);
}
function goHome(){ boardTab='board_index'; go('board_index'); }
function closeTab(id){ tabs=tabs.filter(t=>t.id!==id); if(active===id) goHome(); else render(); }
/* 換頁要捲回頂端的是「網頁」，也就是 .viewport 這個捲動容器，不是整個 window
   ——分頁列跟網址列現在是固定的外框，window 根本不會捲。 */
function toTop(){ const v=document.getElementById('viewport'); if(v) v.scrollTop=0;
  window.scrollTo(0,0); }
function go(id){ if(active!==id) hist.push(active); active=id;
  render(); toTop(); }
function back(){ if(!hist.length)return; const p=hist.pop();
  if(isBoardDoc(p)) boardTab=p;
  active=tabs.some(t=>t.id===p)||isBoardDoc(p)?p:tabs[0].id; render(); toTop(); }

/* ================= 茶水間：播放器 =================
   從頭到尾都是同一支 App、同一個訊息列（#chatapp／#plMsgs）：登入前佔滿畫面，
   登入後浮在假瀏覽器上面，收起來縮成右下角那顆浮球。
   App 沒開就不播——訊息先排在佇列裡，浮球跳未讀數、畫面上緣掉一則推播，
   玩家切回來才「現場」一句一句冒出來，這樣每一段都不會被錯過。 */
let chatShown=[];          // 已經出現在畫面上的訊息
let chatQueue=[];          // 還沒播的步驟
let chatTyping=null;       // 正在「輸入中」的人
let chatDraft=null;        // 等玩家點下去的草稿泡泡
let chatPick=null;         // 等玩家挑一句的選擇泡泡（{ask,opts}）
let chatBusy=false;        // 有 timer 在跑
let toastT=null;
const chatFired=new Set(); // 已經排進佇列的段落
const chatDone=new Set();  // 已經播完的段落
/* 世代計數器：除錯面板跳段的時候，上一段還在飛的 setTimeout 會把舊訊息
   插進新的對話裡（正常玩不會遇到，因為沒有人會在播到一半重建整個聊天室）。
   每次重建就 +1，過期的 timer 自己失效。 */
let chatGen=0;

/* 聊天室的播放速度：下面所有等待的毫秒數寫的都是原本 1x 的節奏，
   實際等待一律除以這個數。要整體加速或放慢就只動這一個值。 */
const CHAT_SPEED=3;
const dly=ms=>devFast?0:Math.round(ms/CHAT_SPEED);   // 秒播模式把所有等待壓成 0

const chatHere=()=>chatOpen&&!saidNow&&prog<6;
/* 浮球上要跳的未讀數：只算「輪到玩家講話之前」的那幾則，不預告後面還有多少。
   已經輪到她講話（草稿泡泡還在等人點）的時候算 1：後面那些話根本還沒送出來，
   算進去等於預告接下來會有幾句，但浮球又不能完全不叫——不然玩家把 App 收起來
   之後，那顆等著被點的草稿泡泡就沒有任何東西提醒他了。 */
function chatPending(){ if(chatDraft||chatPick) return 1;
  let n=0;
  for(const st of chatQueue){ if(st._done) continue; if(st.me!==undefined) break; n++; }
  return n; }

/* 掃一次所有段落，把條件成立的依序排進佇列（不插隊） */
function chatCheck(){
  let added=false;
  CHAT.forEach(sc=>{
    if(chatFired.has(sc.id)||!sc.when()) return;
    chatFired.add(sc.id);
    chatQueue=chatQueue.concat(sc.steps,[{_done:sc.id}]);
    added=true;
  });
  if(added&&!chatHere()){ showToast(); syncApp(); }   // 浮球上的未讀數也要立刻跳出來
  chatPump();
}
function chatPump(){ if(chatBusy||chatDraft||chatPick||!chatQueue.length||!chatHere()) return;
  chatBusy=true; chatNext(); }
function chatNext(){
  if(!chatQueue.length){ chatBusy=false; chatCheck(); return; }
  if(!chatHere()){ chatBusy=false; return; }        // 玩家走開了，剩下的等他回來
  const st=chatQueue[0];
  /* 一段播完：重畫一次整個瀏覽器框，因為有些分頁（例如 g_mail）是等這一段
     播完才掛上去的，光重畫聊天室看不到那個新分頁。render() 結尾會再叫 chatCheck。 */
  if(st._done){ chatQueue.shift(); chatBusy=false; chatDone.add(st._done);
    if(loggedIn) render(); else chatCheck(); return; }
  if(st.me!==undefined){ chatQueue.shift(); chatBusy=false; chatDraft=st; chatPaint(); return; }
  /* 選擇泡泡：跟草稿泡泡一樣把播放停下來，差別是攤開好幾句讓玩家自己挑一句送出 */
  if(st.opts){ chatQueue.shift(); chatBusy=false; chatPick=st; chatPaint(); return; }
  chatQueue.shift();
  const gen=chatGen;
  const reveal=()=>{ if(gen!==chatGen) return;       // 跳過段了，這一則已經不屬於現在這場對話
    chatShown.push(st); chatPaint();
    if(st.now) chatNext(); else setTimeout(chatNext,dly(st.sys?320:450)); };
  if(st.now) return reveal();                        // 開場墊場：整段直接出現
  if(st.sys||st.u===ME.uid) return void setTimeout(reveal,dly(600));
  chatTyping=st.u; chatPaint();                      // 別人講話才有「輸入中」
  /* 「輸入中」的長度跟著字數走：一句「嗯」跟一句三十幾個字的話打一樣久，
     是最容易讓人看出這是排好的稿子的地方。短句放快也順便把序章開頭
     那段只能看不能動的空檔壓短一點。 */
  const len=(st.c||'').length;
  setTimeout(()=>{ if(gen!==chatGen) return; chatTyping=null; reveal(); },
             dly(360+Math.min(len,30)*32+Math.random()*260));
}
/* 玩家點下草稿泡泡＝思妤把那句話送出去 */
function chatSend(){
  const st=chatDraft; if(!st) return;
  chatDraft=null; chatShown.push({u:ME.uid,c:st.me}); chatPaint();
  if(st.end) return void goEnd();
  chatBusy=true; setTimeout(chatNext,dly(500));
}
/* 玩家從選擇泡泡裡挑了一句：記在 picks，該選項自己帶的後續（then）
   插到佇列最前面，同一段接下來的共同台詞照舊排在它後面。 */
function chatChoose(i){
  const st=chatPick; if(!st) return;
  const o=st.opts[i]; if(!o) return;
  chatPick=null; picks[st.ask]=o.v;
  chatShown.push({u:ME.uid,c:o.c}); chatPaint();
  if(o.end) return void goEnd();
  if(o.then&&o.then.length) chatQueue=o.then.concat(chatQueue);
  chatBusy=true; setTimeout(chatNext,dly(500));
}
/* 送出最後一句＝進終幕 */
function goEnd(){ prog=6; setTimeout(()=>{ closeChat(); render(); toTop(); },1100); }

/* 某一段的條件成立了，但玩家用別的方式把它跳過去了（例如自己看出密碼，
   根本沒回茶水間問）：把還沒播的部分丟掉，免得等一下在錯的地方冒出來。 */
function chatDrop(id){
  const sc=CHAT.find(x=>x.id===id); if(!sc||chatDone.has(id)) return;
  chatFired.add(id); chatDone.add(id);
  chatQueue=chatQueue.filter(st=>!sc.steps.includes(st)&&st._done!==id);
  if(chatDraft&&sc.steps.includes(chatDraft)) chatDraft=null;
  if(chatPick&&sc.steps.includes(chatPick)) chatPick=null;
}

/* ---------- 畫面 ---------- */
function plAvatar(u){ const a=AVATARS[u]||{ch:who(u)[0]||'?',bg:'#8A9299'};
  return `<div class="pl-av" style="background:${a.bg}">${esc(a.ch)}</div>`; }
function plRow(u,inner,extraCls){
  const mine=u===ME.uid;
  return `<div class="pl-row${mine?' me':' other'}${extraCls?' '+extraCls:''}">
    ${plAvatar(u)}<div class="pl-col">
      ${mine?'':`<div class="pl-name">${esc(who(u))}</div>`}
      ${inner}</div></div>`;
}
function chatCard(m){
  if(m.url) return `<button class="pl-link" data-login="1">
    <span class="lbl">${esc(m.lbl||'連結')}</span>
    <span class="url">${esc(m.url)}</span></button>`;
  const d=DOCS.find(x=>x.id===m.share)||{}, st=SITE[m.share]||{};
  return `<button class="pl-link" data-share="${esc(m.share)}">
    <span class="lbl">${esc(d.site||'')}</span>
    <span class="tt">${esc(d.title||'')}</span>
    <span class="url">${esc(st.url||'')}</span></button>`;
}
/* 同一個人連著講好幾句的時候，只有第一句掛頭像跟名字——聊天軟體都是這樣，
   一句一個名字看起來會像是四個人輪流各講一次。 */
function chatRows(){
  let prev=null;
  const rows=chatShown.map(m=>{
    if(m.sys){ prev=null; return `<div class="pl-sys">${esc(m.sys)}</div>`; }
    const cont=prev===m.u?'cont':''; prev=m.u;
    if(m.url||m.share) return plRow(m.u,chatCard(m),cont);
    return plRow(m.u,`<div class="pl-bub">${esc(m.c)}</div>`,cont);
  });
  if(chatTyping) rows.push(plRow(chatTyping,
    `<div class="pl-bub"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`,
    'pl-typing'+(prev===chatTyping?' cont':'')));
  if(chatDraft) rows.push(plRow(ME.uid,
    `<button class="pl-bub pl-draft" id="plDraft">${esc(chatDraft.me)}</button>`,
    prev===ME.uid?'cont':''));
  if(chatPick) rows.push(`<div class="pl-pick">
    ${chatPick.prompt?`<div class="pk-t">${esc(chatPick.prompt)}</div>`:''}
    ${chatPick.opts.map((o,i)=>
      `<button class="pk-o" data-pick="${i}">${esc(o.c)}</button>`).join('')}
  </div>`);
  return `<div class="pl-stack">${rows.join('')}</div>`;
}
function chatBind(){
  const d=document.getElementById('plDraft'); if(d) d.onclick=chatSend;
  document.querySelectorAll('[data-pick]').forEach(b=>{
    b.onclick=()=>chatChoose(+b.dataset.pick);});
  /* 點冠廷傳來的網址＝切去瀏覽器把它打開：茶水間收起來，後面是五樓的登入頁 */
  document.querySelectorAll('[data-login]').forEach(b=>{ b.onclick=()=>{
    loginSeen=true;                       // 從這裡開始，茶水間後面有一頁可以回去
    closeChat();
    document.getElementById('login').style.display='block';
    /* 帳號是站台記住的，游標直接落在她想不起來的那一欄 */
    if(window.matchMedia('(min-width:601px)').matches) document.getElementById('p').focus();
  };});
  /* 群組裡貼出來的連結也一樣：開在瀏覽器那邊，茶水間讓位 */
  document.querySelectorAll('[data-share]').forEach(b=>{
    b.onclick=()=>{ closeChat(); openDoc(b.dataset.share); };});
  const box=document.getElementById('plMsgs'); if(box) box.scrollTop=box.scrollHeight;
  chatInBar();
}
/* 輸入列：沒有草稿泡泡時是一條按不下去的假輸入框，有草稿時整條換成
   「點上面那句話送出」——遊戲的第一個必要動作就是點草稿泡泡，
   那個提示在登入之前就得在。 */
function chatInBar(){
  const el=document.getElementById('plIn'); if(!el) return;
  el.className='pl-in'+(chatDraft||chatPick?' act':'');
  el.innerHTML=chatDraft?'↑ 點上面那句話送出'
    :chatPick?'↑ 選一句送出'
    :'<span class="fld">輸入訊息…</span><span class="snd">送出</span>';
}
function chatPaint(){
  const box=document.getElementById('plMsgs'); if(!box) return;
  box.innerHTML=chatRows(); chatBind(); syncApp();
}
/* App 的開關：整支聊天室只是蓋在畫面上的一層，開關就是加減一個 class。
   收起來不會丟掉任何東西——訊息列一直都在，回來就接著往下播。
   （syncApp 要排在 chatPaint 前面：藏著的元素量不出高度，捲到最新訊息會落空。） */
function openChat(){ chatOpen=true; hideToast(); syncApp(); chatPaint(); chatCheck(); }
function closeChat(){ chatOpen=false; syncApp(); }
function syncApp(){
  const app=document.getElementById('chatapp'), dock=document.getElementById('chatdock');
  if(!app||!dock) return;
  const live=prog<6;                        // 終幕之後整支 App 收掉
  app.classList.toggle('on',chatOpen&&live);
  app.classList.toggle('solo',!loggedIn);   // 還沒登入：後面沒有瀏覽器，置中成一支手機
  app.classList.toggle('hasback',loggedIn||loginSeen);
  const n=chatPending();
  /* 登入之前也要有浮球：登入頁上點了「忘記密碼」之後，玩家得走得回茶水間問人 */
  dock.hidden=!((loggedIn||loginSeen)&&live&&!chatOpen);
  dock.innerHTML='茶'+(n?`<span class="bd">${n}</span>`:'');
  /* 佇列裡第一步就是她自己的草稿泡泡時未讀數是 0（那還不是別人講的話），
     但浮球不能完全不動——沒有數字，至少讓它跳 */
  dock.classList.toggle('un',n>0||chatQueue.length>0);
}
/* App 收起來的時候，用一則推播把人叫回去 */
function showToast(){
  const el=document.getElementById('toast'); if(!el) return;
  el.innerHTML=`<span class="ic">茶</span><span><span class="t">茶水間</span>`
    +`<span class="s">有新訊息</span></span>`;
  el.hidden=false;
  el.onclick=openChat;
  clearTimeout(toastT); toastT=setTimeout(hideToast,6000);
}
function hideToast(){ const el=document.getElementById('toast');
  if(el) el.hidden=true; clearTimeout(toastT); }

/* ================= 登入 =================
   帳號是站台記住的（欄位鎖死），密碼沒有：她十一年沒登入，得自己想起來。
   「忘記密碼」掀出來的提示問題是她二十三歲自己設的——「我的生日」。
   生日 1120 就掛在她自己的帳號後面，玩家一定打得出來，然後被擋下來：
   照著提示做卻進不去，這一下才是把人趕回茶水間的引信（`c_pw`）。
   群組裡給的是一條規則（她當年把生日倒過來打），不是一組數字——
   0211 要玩家自己倒出來。 */
function showPwHint(){                  // 掀開提示問題：玩家自己點，或打錯生日之後自動掀
  const hb=document.getElementById('lhint'); if(hb) hb.hidden=false;
  document.getElementById('lforgot').hidden=true;
  pwAsked=true;
}
document.getElementById('lforgot').onclick=()=>{
  showPwHint(); document.getElementById('p').focus();
};
document.getElementById('go').onclick=()=>{
  const u=document.getElementById('u').value.trim().toLowerCase();
  const p=document.getElementById('p').value.trim();
  const e=document.getElementById('lerr');
  if(u!==ME.uid){ e.textContent='帳號或密碼錯誤。'; return; }
  if(!match(p,ME.pwOk)){
    /* 照提示打了生日還是進不去——她會回群組問，這段對話從這裡開始 */
    if(match(p,ME.bd)){
      showPwHint();                     // 提示還沒掀開的話，這時候她自己去看了一次
      e.textContent='密碼不正確。';
      if(!pwFail){ pwFail=true; chatCheck(); }
    } else {
      e.textContent=p?'密碼不正確，請再試一次。':'請輸入密碼。';
    }
    return;
  }
  /* 她自己想起來、沒回去問人的話，那段就不要了——不然會在登入之後才冒出來 */
  chatDrop('c_pw');
  document.getElementById('login').style.display='none';
  document.getElementById('browser').style.display='flex';
  loggedIn=true;                       // 從這裡開始，手上同時有兩支 App：瀏覽器跟茶水間
  /* 她剛剛人就在茶水間裡，登入完不該被丟在一個十年沒動的板首頁上：
     聊天室浮回最上層，開場最後那句「謝謝！」和整段序章就地接著演完。
     瀏覽器停在板首頁等她——她自己把茶水間收起來，才會看到那個板。 */
  active='board_index'; boardTab='board_index';
  syncTabs(); render(); openChat(); toTop();
};
document.getElementById('p').addEventListener('keydown',e=>{
  if(e.key==='Enter')document.getElementById('go').click();});

/* ================= 繪製 ================= */
function render(){ syncTabs(); renderChrome(); renderPage();
  document.querySelectorAll('[data-home]').forEach(b=>{ b.onclick=goHome; });
  document.querySelectorAll('[data-rules]').forEach(b=>{ b.onclick=()=>openDoc('t_rules'); });
  const adx=document.getElementById('adX');
  if(adx) adx.onclick=()=>{ adOpen=false; render(); };
  syncApp(); chatCheck(); }

function renderChrome(){
  const strip=document.getElementById('tabstrip');
  if(prog>=6){ strip.innerHTML=''; document.getElementById('omniUrl').innerHTML=''; return; }
  strip.innerHTML='';
  tabs.forEach(t=>{
    const s=SITE[t.id]||{};
    const el=document.createElement('div');
    el.className='tab'+(active===t.id?' on':'');
    el.innerHTML=`<span class="fav" style="background:${s.fav||'#8A9299'}"></span>`
      +`<span class="tt">${esc(s.tab||t.id)}</span>`
      +(t.kind==='doc'?'<button class="cl">✕</button>':'');
    el.onclick=e=>{ if(e.target.classList.contains('cl')){closeTab(t.id);return;} go(t.id); };
    strip.appendChild(el);
  });
  const u=(SITE[active]||{}).url||'';
  const sec=u.indexOf('https')===0?'https://':u.indexOf('file')===0?'file:///':'http://';
  document.getElementById('omniUrl').innerHTML=
    `<span class="sec">${esc(sec)}</span>${esc(u.replace(/^(https?:\/\/|file:\/\/\/)/,''))}`;
  document.getElementById('navBack').disabled=!hist.length;
}

function renderPage(){
  const vp=document.getElementById('viewport');
  if(prog>=6) return renderEnd(vp);
  if(saidNow){ vp.className='viewport vp-said'; return renderSaid(vp); }
  const g=curGate();
  if(g&&active===g.id){
    vp.className='viewport vp-'+(g.skin==='restore'?'admin':g.skin);
    /* 板務後台是同一個分頁的兩步：還沒登入先畫登入框，登入之後就地換成還原清單 */
    if(g.skin==='restore') return adminIn?renderRestore(vp,g):renderGate(vp,ADMIN_LOGIN);
    return renderGate(vp,g);
  }
  if(active==='board_index'){ vp.className='viewport vp-wulou'; return renderBoardIndex(vp); }
  if(active==='notes'){ vp.className='viewport vp-notes'; return renderNotes(vp); }
  const d=DOCS.find(x=>x.id===active);
  if(!d){ vp.className='viewport vp-wulou'; vp.innerHTML='<div class="pg">找不到網頁</div>'; return; }
  vp.className='viewport vp-'+d.skin;
  if(d.skin==='wulou')   return renderThread(vp,d);
  if(d.skin==='archive') return renderArchive(vp,d);
  if(d.skin==='inbox')   return renderInbox(vp,d);
  if(d.skin==='blog')    return renderBlog(vp,d);
  if(d.skin==='scan')    return renderScan(vp,d);
}

/* ---------- 五樓的頁首廣告與站尾 ---------- */
/* wulou.5gbfree.com 是免費空間，免費空間一定會在頁首插一條自己的廣告。

function wlAd(){
  return adOpen?`<div class="wl-ad"><span class="tag">廣告</span>
    <span class="txt">5GBfree 免費網頁空間　註冊就送 5GB　馬上擁有自己的網站 ▸</span>
    <button class="x" id="adX" title="關閉">✕</button></div>`:'';

/* 站尾：訪客計數器、文章數、最後更新、Powered by。

   「最後更新」是動態算出來的——玩家看到的永遠是板上真的最新那一天。 */
function wlFoot(){
  const rows=boardRows();
  const ts=String(rows.reduce((m,r)=>Math.max(m,r.x.ts),0));
  const last=ts.length>=8?`${ts.slice(0,4)}/${ts.slice(4,6)}/${ts.slice(6,8)}`:'—';
  return `<div class="wl-foot">
    <div>本站訪客人次<span class="led">006418</span></div>
    <div>五樓　│　文章 ${rows.length} 篇　│　最後更新 ${esc(last)}　│　板主 ytl_lin</div>
    <div class="pw">Powered by MiniBBS 1.2　│　本站空間由 5GBfree 免費提供，頁首廣告為系統自動插入</div>
  </div>`;
}

/* ---------- 板首頁 ---------- */
const PER_PAGE=8;        // 每頁篇數；置頂那串不算在內，每一頁都會出現
let boardPage=1;
function renderBoardIndex(vp){
  /* 手機上這一行只差幾個字就會擠出去，所以補白抓得剛好夠對齊就好（名字都是兩個字） */
  const line=x=>`${x.f}　│　人氣 ${String(x.hits??0).padStart(4,' ')}　│　最後回覆 ${who(x.by).padEnd(4,'　')}│　${x.when}`;
  const row=r=>r.deco
    ?`<div class="idx-row deco"><div class="t">${esc(r.label)}</div>
      <div class="m">${esc(line(r.x))}</div></div>`
    :`<button class="idx-row${r.top?' top':''}${r.lock?' locked':''}${r.filler?' filler':seen.has(r.doc)?'':' new'}" data-idx="${r.doc}">
      <div class="t">${r.lock?'<span class="lk">🔒</span>':''}${esc(r.label)}</div>
      <div class="m">${esc(line(r.x))}</div></button>`;

  const all=boardRows(), tops=all.filter(r=>r.top), rest=all.filter(r=>!r.top);
  const pages=Math.max(1,Math.ceil(rest.length/PER_PAGE));
  boardPage=Math.min(Math.max(1,boardPage),pages);
  const rows=tops.concat(rest.slice((boardPage-1)*PER_PAGE,boardPage*PER_PAGE)).map(row).join('');

  let nums='';
  for(let i=1;i<=pages;i++)
    nums+=`<button class="p${i===boardPage?' on':''}" data-pg="${i}">${i}</button>`;
  const pager=`<div class="wl-pager">
    <button data-pg="${boardPage-1}"${boardPage<=1?' disabled':''}>‹ 上一頁</button>
    ${nums}
    <button data-pg="${boardPage+1}"${boardPage>=pages?' disabled':''}>下一頁 ›</button>
    <span class="tot">共 ${pages} 頁</span>
  </div>`;

  vp.innerHTML=`<div class="cols"><div class="main">
    ${wlAd()}
    <div class="wl-hd"><span class="lg">五樓</span>
      <span class="nv"><button data-home>主板</button>　│　精華區　│　<button data-rules>板規</button></span>
      <span class="me">${esc(ME.name)}（${esc(ME.uid)}）</span></div>
    <div class="wl-sub">主板　│　板主 ytl_lin　│　依最後回覆排序</div>
    <div class="wl-body idx-list">${rows}${pager}</div>
    ${wlFoot()}
  </div></div>`;

  document.querySelectorAll('[data-idx]').forEach(b=>{
    b.onclick=()=>{ openDoc(b.dataset.idx); };
  });
  document.querySelectorAll('[data-pg]').forEach(b=>{
    b.onclick=()=>{ boardPage=+b.dataset.pg; render(); };
  });
}

function renderGate(vp,g){
  const f=g.fields.map((x,i)=>
    `<label for="f${i}">${esc(x.label)}</label>
     <input id="f${i}" type="${x.type==='password'?'password':'text'}"

    +(x.remember?`<label class="remember"><input type="checkbox" checked disabled>記住我的帳號</label>`:''))
   .join('');
  const forgotHtml=g.forgot?`<button type="button" class="linklike" id="forgotBtn">忘記密碼？</button>
    <div class="hintq" id="hintBox" hidden><div class="hintq-t">密碼提示問題</div>
      <div class="hintq-q">${esc(g.forgot.hint)}</div></div>`:'';
  const form=`<div class="form">${g.note?`<div class="note">${esc(g.note)}</div>`:''}${f}${forgotHtml}
    <button class="btn wide" id="gsub">送出</button><div class="msg" id="gmsg"></div></div>`;

  if(g.skin==='admin'){
    vp.innerHTML=`<div class="ad"><div class="ttl">${esc(g.brand[0])}</div>
      <div class="in"><h2>還原已刪除文章</h2><div class="sub">${esc(g.brand[1])}</div>
      ${form}</div></div>`;
  } else if(g.skin==='search'){
    vp.innerHTML=`<div class="se">
      <div class="lg">搜尋</div>
      <input id="f0" autocomplete="off" spellcheck="false" placeholder="">
      <div class="acts"><button class="btn" id="gsub">搜尋</button></div>
      <div class="msg" id="gmsg"></div>
      <div id="sres"></div></div>`;
  } else {
    vp.innerHTML=`<div class="yh-top"><span class="lg">YAHOO!<em>奇摩</em></span>
        <span style="font-size:12px">登入</span></div>
      <div class="sysbox"><div class="brandline">${esc(g.brand[0])}</div>
      <div class="subline">${esc(g.brand[1])}</div><div class="box">${form}</div></div>`;
  }

  setTimeout(()=>{
    const msg=document.getElementById('gmsg');
    const submit=()=>{
      const vals=g.fields.map((x,i)=>(document.getElementById('f'+i)||{}).value||'');
      const ok=g.fields.every((x,i)=>x.locked||match(vals[i],x.answer));
      if(!ok){
        if(msg){
          let t=g.err;
          if(g.nudge) for(const k in g.nudge) if(vals.some(v=>norm(v)===norm(k))) t=g.nudge[k];
          msg.textContent=t;
        }
        return;
      }

      if(g.id==='g_search'){ showSearchResult(); return; }
      /* 板務後台的登入：不是一道閘，不推進度，只是把這一頁換成還原清單。
         「你現在是他」停在這一刻——她剛剛用他的帳號進來了。 */
      if(g.id==='g_admin_login'){
        adminIn=true;
        saidNow='密碼十一年沒有改過，一次就進去了。\n畫面右上角寫著「ytl_lin」。\n\n你現在是他。';
        render(); toTop(); return;
      }
      gateDone[g.id]=true;
      prog=AFTER[g.id].unlockAt;
      saidNow=AFTER[g.id].said||'';
      if(g.id==='g_mail'){                 // 登入成功 → 留在信箱
        mailFolder='in'; mailOpen=null;
        seen.add('m_box'); openTab('m_box');
      } else {
        goHome();
      }
    };
    const b=document.getElementById('gsub'); if(b)b.onclick=submit;
    g.fields.forEach((x,i)=>{const el=document.getElementById('f'+i);
      if(el)el.onkeydown=e=>{if(e.key==='Enter')submit();};});
    const fb=document.getElementById('forgotBtn');
    if(fb) fb.onclick=()=>{
      const hb=document.getElementById('hintBox'); if(hb)hb.hidden=false;
      fb.hidden=true;
      const pwIdx=g.fields.findIndex(x=>x.type==='password');
      const pw=document.getElementById('f'+(pwIdx<0?0:pwIdx)); if(pw)pw.focus();
    };
    const firstIdx=g.fields.findIndex(x=>!x.locked);
    const first=document.getElementById('f'+(firstIdx<0?0:firstIdx)); if(first)first.focus();
  },0);
}

/* ---------- 我的最愛 ---------- */
function notesContent(){
  const g=curGate();
  const ahead=DOCS.filter(d=>d.at>prog&&d.peek).map(d=>d.at);
  const nextAt=ahead.length?Math.min(...ahead):-1;   // 只預告下一階，不把整條線一次攤開
  const docs=DOCS.map(d=>{
    if(prog>=d.at) return `<button class="doc${seen.has(d.id)?'':' new'}" data-doc="${d.id}">
      <div class="t">${esc(d.title)}</div><div class="m">${esc(d.site)}</div></button>`;
    if(d.peek&&d.at===nextAt) return `<div class="doc lock">
      <div class="t">${esc(d.lockTitle||d.title)}</div><div class="m">${esc(d.peek)}</div></div>`;
    return '';
  }).join('');
  const gi=g?GATES.findIndex(x=>x.id===g.id):GATES.length;
  const steps=GATES.map((x,i)=>{
    const done=!!gateDone[x.id];
    const now=g&&g.id===x.id;
    if(i>gi) return `<div class="step future"><span class="mk">□</span>${esc(x.ch)}　？？？</div>`;
    return `<div class="step${done?' done':''}${now?' now':''}">
      <span class="mk">${done?'■':'□'}</span>${esc(x.ch)}　${esc(x.label)}
      ${now?`<div class="sub">${esc(x.need)}</div>`:''}</div>`;
  }).join('');
  return `<div class="card"><h2>📁　已蒐集的資料</h2>${docs}</div>
    <div class="card"><h2>📁　待辦事項</h2>${steps}
      ${g?`<button class="gotab" id="goGate">開啟　${esc(SITE[g.id].tab)}</button>`:''}</div>`;
}
function renderNotes(vp){
  vp.innerHTML=`<div class="nt">
    <div class="nt-hd"><span class="star">★</span><h1>我的最愛</h1></div>
    ${notesContent()}
  </div>`;
  document.querySelectorAll('[data-doc]').forEach(b=>{
    b.onclick=()=>{ openDoc(b.dataset.doc); };});
  const gg=document.getElementById('goGate');
  if(gg){ const g=curGate(); if(g) gg.onclick=()=>go(g.id); }
}

/* ---------- 終幕 ----------
   最後一句是玩家自己挑的，所以第一段跟著那個選擇走。
   那句「我也想過要這樣做」不再是最後一頁才空降的關鍵事實——
   玩家在 `d_box` 那張手寫稿上已經讀過它，也讀過他劃掉的那幾行；
   這裡只負責讓它沉下來。 */
function renderEnd(vp){
  vp.className='viewport vp-end';
  const head={
    accuse:`<p>你送出了。</p>
      <p>十一年來，這是第一次有人把他的名字，<br>跟那年真正發生的事，放進同一句話裡。</p>`,
    confess:`<p>你送出了。</p>
      <p>那封信在垃圾桶裡躺了十一年。<br>這是第一次有人承認它被讀過。</p>`,
    silent:`<p>你把打好的那句刪掉，換成了這一句，才送出。</p>
      <p>群組很快就跳出下一則訊息。<br>沒有人追問。這一次也一樣。</p>`
  }[picks.final]||`<p>你送出了。</p>`;
  vp.innerHTML=`<div class="end">
    ${head}
    <p class="q">他那天最後說的那句，聲音很輕，快得像是說給自己聽的——<br><br>
      「我也想過要這樣做。」</p>
    <p>那句話他前一天晚上就寫在紙背上了，寫在劃掉的三行下面。</p>
    <p>沒有人記得這句。因為沒有人在聽。</p>
    <p class="sig">－ 五樓 －</p>
  </div>`;
}

document.getElementById('navBack').onclick=back;
document.getElementById('navRel').onclick=()=>render();

/* 茶水間 App 的外框：群組名字只有一份資料，畫在這裡 */
document.getElementById('caTtl').innerHTML=
  `${esc(CHAT_TITLE)}<span class="sub">${esc(CHAT_SUB)}</span>`;
/* 這兩顆用箭頭函式綁，呼叫的當下才去查 openChat／closeChat——
   檔尾的除錯面板會把這兩個函式包起來，直接綁參考會綁到包裝前的舊版本 */
document.getElementById('caBack').onclick=()=>closeChat();
document.getElementById('chatdock').onclick=()=>openChat();
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&chatOpen&&(loggedIn||loginSeen)) closeChat(); });

/* ================= 除錯面板 =================
   只有網址後面帶 #dev 才會存在（例如 …/五樓_單人版.html#dev）。hash 重整不會掉，
   所以手機上輸入一次就好；沒帶 hash 的人完全看不到、也碰不到任何相關程式碼。

   為什麼不做成遊戲內的章節選單：這是恐怖遊戲，可見的跳關入口會直接毀掉沉浸感。

   跳段的時候會把「那個時間點之前所有該播完的聊天段落」整段補進聊天室（照原本的
   順序，草稿泡泡直接算成她已經送出），所以跳過去就能直接往回捲讀完整對話——
   這是拿來校內容的，不是存檔。 */
const DEV=location.hash.toLowerCase().includes('dev');

/* 每一段要把遊戲狀態擺成什麼樣子。順序＝面板上的按鈕順序 */
const DEV_STAGES=[
 {k:'開場',      note:'重新載入，從頭演',reload:1},
 {k:'序章',      prog:0, chat:1},
 {k:'序章·整理', prog:0, at:'t_sort'},
 {k:'序章·存檔', prog:0, sawSort:1, at:'a_im'},
 {k:'①信箱',     prog:1, done:['g_mail'], at:'m_box'},
 {k:'①板務後台', prog:1, done:['g_mail'], at:'g_admin'},
 {k:'①還原清單', prog:1, done:['g_mail'], adm:1, at:'g_admin'},
 {k:'②搜尋',     prog:3, done:['g_mail','g_admin'], rst:1, at:'g_search'},
 {k:'②部落格',   prog:5, done:['g_mail','g_admin','g_search'], rst:1, at:'blog'},
 {k:'②那三張',   prog:5, done:['g_mail','g_admin','g_search'], rst:1, at:'d_box'},
 {k:'終幕',      prog:6, done:['g_mail','g_admin','g_search'], rst:1, at:'end'}
];

function devApply(st){
  if(st.reload) return location.reload();
  /* 先把聊天室清空重建，否則會疊在開場已經自己播出來的那幾則上面 */
  chatGen++;                          // 上一段還在飛的 timer 從這一刻起全部失效
  chatShown=[]; chatQueue=[]; chatDraft=null; chatTyping=null; chatBusy=false;
  chatFired.clear(); chatDone.clear(); chatPick=null;
  seen.clear(); mailRead.clear(); restored.clear(); gateDone={};
  Object.keys(picks).forEach(k=>delete picks[k]);
  restoreMsg=''; saidNow=''; hist=[]; blogRead=false; adminIn=false;

  loggedIn=true; loginSeen=true; pwAsked=true; pwFail=true;
  chatOpen=!!st.chat;                 // 茶水間是另一支 App：這一段要不要開著它
  document.getElementById('login').style.display='none';
  document.getElementById('browser').style.display='flex';

  prog=st.prog;
  (st.done||[]).forEach(g=>gateDone[g]=true);
  adminIn=!!st.adm||st.prog>=3;
  if(st.sawSort||st.prog>=1) seen.add('t_sort');
  if(st.prog>=1){ seen.add('m_box'); seen.add('t_new'); seen.add('a_im'); }
  if(st.prog>=3) seen.add('t_prank');
  /* 終幕的門檻要看得到的三份證據，跳段時一併補齊，不然 c_end 排不進來 */
  if(st.rst){ restored.add('r_sort'); seen.add('a_im'); seen.add('t_stop'); seen.add('t_after');
    mailRead.add('ytl'); mailRead.add('yr'); blogRead=st.prog>=5; }
  if(st.prog>=5){ seen.add('blog'); seen.add('d_box'); }

  /* 條件已經成立的段落直接補完文字（c_end 例外：那顆草稿要留給人自己送出） */
  CHAT.forEach(sc=>{
    if(sc.id==='c_end'||!sc.when()) return;
    chatFired.add(sc.id); chatDone.add(sc.id);
    sc.steps.forEach(t=>{
      if(t._done||t.url) return;          // 開場那張網址卡片會把登入頁叫回來，補歷史時略過
      if(t.opts){                         // 選擇泡泡：補歷史時一律當成她挑了第一句
        picks[t.ask]=t.opts[0].v;
        chatShown.push({u:ME.uid,c:t.opts[0].c});
        (t.opts[0].then||[]).forEach(x=>chatShown.push(x.me!==undefined?{u:ME.uid,c:x.me}:x));
        return;
      }
      chatShown.push(t.me!==undefined?{u:ME.uid,c:t.me}:t);
    });
  });

  boardTab=st.at==='board_index'?'board_index':boardTab;
  syncTabs();
  if(st.at&&st.at!=='end'){ if(!tabs.some(t=>t.id===st.at)) tabs.push({id:st.at,kind:'doc'}); active=st.at; }
  render(); chatPaint(); toTop(); devPaint();
}

function devPaint(){
  const box=document.getElementById('devPanel'); if(!box||box.hidden) return;
  const stages=DEV_STAGES.map((x,i)=>
    `<button class="j" data-stage="${i}">${esc(x.k)}</button>`).join('');
  const docs=DOCS.map(d=>
    `<button class="j doc" data-doc="${esc(d.id)}">${esc(d.title)}</button>`).join('');
  /* 常用的（跳段、秒播、狀態）擺前面，長長的文件清單放最後才不會把它們擠出畫面 */
  box.innerHTML=`<h4>跳段</h4><div class="grid">${stages}</div>
    <label class="sw"><input type="checkbox" id="devF"${devFast?' checked':''}>秒播聊天室（不跑輸入中動畫）</label>
    <div class="st">prog=${prog}　active=${esc(active)}　loggedIn=${loggedIn}　茶水間=${chatOpen?'開':'收'}<br>
      分頁：${tabs.map(t=>esc(t.id)).join(' / ')}</div>
    <h4>直接開文件（無視解鎖）</h4><div class="grid">${docs}</div>`;
  box.querySelectorAll('[data-stage]').forEach(b=>{
    b.onclick=()=>devApply(DEV_STAGES[+b.dataset.stage]); });
  box.querySelectorAll('[data-doc]').forEach(b=>{
    b.onclick=()=>{ const d=DOCS.find(x=>x.id===b.dataset.doc);
      if(d&&prog<d.at) prog=d.at;            // 鎖住的也讓它開得起來
      openDoc(b.dataset.doc); devPaint(); }; });
  const f=document.getElementById('devF');
  if(f) f.onchange=()=>{ devFast=f.checked; chatPump(); };
}

if(DEV){
  const wrap=document.getElementById('dev'), tab=document.getElementById('devTab'),
        box=document.getElementById('devPanel');
  wrap.hidden=false;
  tab.onclick=()=>{ box.hidden=!box.hidden; tab.classList.toggle('on',!box.hidden); devPaint(); };
  const _render=render;                       // 面板上的狀態列跟著畫面一起更新
  render=function(){ _render.apply(null,arguments); devPaint(); };
  /* 收起／叫回茶水間不會經過 render()，狀態列會停在上一個值——這兩顆也包起來 */
  const _open=openChat, _close=closeChat;
  openChat=function(){ _open.apply(null,arguments); devPaint(); };
  closeChat=function(){ _close.apply(null,arguments); devPaint(); };
}

syncApp();
chatCheck();   // 開場那段從這裡開始播（此時還沒登入，茶水間佔滿整個畫面）
</script>
</body>
</html>
