<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>五樓</title>
<style>
:root{
  --board:#4A6D8C; --board-dark:#3A566E;
  --page:#E4E8EC; --panel:#FFFFFF;
  --line:#C0C9D2; --line-soft:#DDE3E9;
  --ink:#22282E; --ink-soft:#5C6873;
  --link:#16387C; --warm:#8C6A3A;
  --chrome:#D6D9DD;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:#9BA3AB;color:var(--ink);
  font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;
  font-size:13px;line-height:1.75}
button{font-family:inherit;cursor:pointer}

/* ===== 開場：現在的聊天室 ===== */
#prelude{max-width:380px;margin:10vh auto 0;padding:0 16px}
.pl-wrap{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;
  box-shadow:0 1px 3px rgba(0,0,0,.15)}
.pl-top{padding:12px 14px;border-bottom:1px solid var(--line-soft);font-size:13px;
  font-weight:600;color:var(--ink);background:#F3F5F7}
.pl-top .sub{display:block;font-weight:400;font-size:11px;color:var(--ink-soft);margin-top:2px}
.pl-msgs{padding:14px;display:flex;flex-direction:column;gap:8px;max-height:62vh;overflow-y:auto}
.pl-row{display:flex;align-items:flex-end;gap:7px;max-width:88%}
.pl-row.other{align-self:flex-start}
.pl-row.me{align-self:flex-end;flex-direction:row-reverse}
.pl-av{width:26px;height:26px;border-radius:50%;flex:none;color:#fff;font-size:11px;
  display:flex;align-items:center;justify-content:center;font-weight:600}
.pl-col{display:flex;flex-direction:column;min-width:0}
.pl-row.other .pl-col{align-items:flex-start}
.pl-row.me .pl-col{align-items:flex-end}
.pl-name{font-size:11px;color:var(--ink-soft);margin:0 3px 3px}
.pl-bub{padding:8px 12px;border-radius:15px;font-size:13px;line-height:1.6;white-space:pre-wrap}
.pl-row.other .pl-bub{background:#EEF0F2;color:var(--ink);border-bottom-left-radius:4px}
.pl-row.me .pl-bub{background:var(--board);color:#fff;border-bottom-right-radius:4px}
.pl-typing .pl-bub{padding:11px 14px;display:flex;gap:3px;align-items:center}
.pl-typing .dot{width:6px;height:6px;border-radius:50%;background:#9AA4AD;
  animation:pldot 1.1s infinite ease-in-out}
.pl-typing .dot:nth-child(2){animation-delay:.15s}
.pl-typing .dot:nth-child(3){animation-delay:.3s}
@keyframes pldot{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}
.pl-link{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:13px;
  border:1px solid var(--line);background:#FAFBFC;color:var(--link);font-size:12px;
  border-bottom-right-radius:4px}
.pl-link:hover{background:#F0F3F6}
.pl-link .lbl{display:block;color:var(--ink-soft);font-size:11px;margin-bottom:3px}
.pl-link .url{font-family:"Courier New",monospace}
.pl-row.me .pl-draft{cursor:pointer;border:1px dashed rgba(255,255,255,.7);
  background:var(--board);opacity:.55;font-family:inherit;text-align:left}
.pl-row.me .pl-draft:hover{opacity:.8}
.pl-foot{padding:10px 14px;border-top:1px solid var(--line-soft);text-align:center;
  font-size:11px;color:var(--ink-soft)}
.pl-sys{align-self:center;max-width:92%;text-align:center;padding:3px 10px;
  font-size:11px;color:#98A3AD;letter-spacing:.06em;line-height:1.7}
.pl-row.other .pl-link{border-bottom-left-radius:4px;border-bottom-right-radius:13px}
.pl-link .tt{display:block;color:var(--ink);font-size:12.5px;margin-bottom:2px}

/* 登入後：同一個聊天室搬進瀏覽器分頁 */
.vp-chat{background:#DFE3E7}
.chatpane{max-width:540px;margin:0 auto}
.chatpane .pl-msgs{max-height:66vh;min-height:52vh}
.pl-in{padding:9px 14px;border-top:1px solid var(--line-soft);background:#FAFBFC;
  font-size:12px;color:#A2AAB2}
.pl-in.act{color:var(--board)}

/* ===== 登入 ===== */
#login{display:none;max-width:330px;margin:14vh auto 0;padding:0 16px}
.brand{font-family:"MingLiU","SimSun","Songti TC",serif;font-size:50px;letter-spacing:.22em;
  color:#2C3E50;text-align:center;margin:0 0 2px;text-indent:.22em}
.brand-sub{text-align:center;color:#5C6873;font-size:11px;letter-spacing:.3em;
  text-indent:.3em;margin-bottom:24px}
.loginbox{background:var(--panel);border:1px solid var(--line);padding:20px 18px 18px}
.loginbox label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:4px}
.loginbox input{width:100%;padding:7px 8px;margin-bottom:13px;border:1px solid var(--line);
  background:#FCFDFD;font-family:"Courier New",monospace;font-size:14px;color:var(--ink)}
.loginbox input:focus{outline:2px solid var(--board);outline-offset:-1px}
.btn{padding:8px 18px;background:var(--board);color:#fff;border:1px solid var(--board-dark);
  font-size:13px;letter-spacing:.08em}
.btn:hover{background:var(--board-dark)}
.btn.wide{width:100%}
.btn:disabled{background:#A8B2BB;border-color:#98A3AD;cursor:default}
.loginerr{color:#8C3A3A;font-size:12px;min-height:20px;margin-top:9px;text-align:center}
.footnote{text-align:center;color:#4A5560;font-size:11px;margin-top:20px;line-height:2}

/* ===== 瀏覽器外殼 ===== */
#browser{display:none;max-width:980px;margin:0 auto;min-height:100vh;
  background:var(--chrome);box-shadow:0 0 0 1px #8A9299}
.tabstrip{display:flex;align-items:flex-end;gap:1px;padding:6px 8px 0;
  background:#B9BEC4;overflow-x:auto}
.tab{display:flex;align-items:center;gap:6px;padding:6px 10px 7px;min-width:104px;max-width:220px;
  background:#C6CBD0;border:1px solid #A6ADB4;border-bottom:0;border-radius:5px 5px 0 0;
  font-size:12px;color:#3A424A;white-space:nowrap;flex:none}
.tab:hover{background:#CFD4D9}
.tab.on{background:var(--chrome);border-color:#8A9299;padding-bottom:8px;margin-bottom:-1px;z-index:2}
.tab .fav{width:11px;height:11px;flex:none;border-radius:2px}
.tab .tt{overflow:hidden;text-overflow:ellipsis}
.tab .cl{margin-left:auto;background:none;border:0;color:#6E7A85;font-size:12px;padding:0 2px;line-height:1}
.tab .bd{margin-left:auto;flex:none;background:#B03A3A;color:#fff;padding:0 4px;
  min-width:15px;height:15px;border-radius:8px;font-size:9px;line-height:1;
  font-family:"Courier New",monospace;display:flex;align-items:center;justify-content:center}
.toast{position:fixed;top:14px;right:16px;z-index:40;max-width:250px;cursor:pointer;
  background:#2C3E50;color:#EDF1F4;border-radius:8px;padding:9px 14px;line-height:1.6;
  box-shadow:0 3px 12px rgba(0,0,0,.32);animation:fin .35s ease}
.toast[hidden]{display:none}
.toast .t{display:block;font-size:12px;font-weight:600}
.toast .s{font-size:11px;color:#A9B4BE}
.omni{display:flex;align-items:center;gap:8px;padding:7px 10px;
  background:var(--chrome);border-bottom:1px solid #A6ADB4}
.omni .navb button{background:none;border:0;color:#6E7A85;font-size:14px;padding:1px 5px}
.omni .navb button:disabled{color:#B0B7BE;cursor:default}
.omni .url{flex:1;min-width:0;background:#fff;border:1px solid #A6ADB4;border-radius:2px;
  padding:4px 9px;font-family:"Courier New",monospace;font-size:12px;color:#3A424A;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.omni .url .sec{color:#8A9299}
.viewport{min-height:78vh;padding:14px 12px 40px}

/* ===== 五樓 ===== */
.vp-wulou{background:var(--page);
  background-image:repeating-linear-gradient(180deg,rgba(0,0,0,.012) 0 1px,transparent 1px 4px)}
.pg{max-width:800px;margin:0 auto}
.wl-hd{background:var(--board);color:#fff;padding:8px 12px;display:flex;
  align-items:baseline;gap:12px;flex-wrap:wrap}
.wl-hd .lg{font-family:"MingLiU","SimSun",serif;font-size:18px;letter-spacing:.18em}
.wl-hd .nv{font-size:11px;opacity:.72;letter-spacing:.08em}
.wl-hd .nv button{background:none;border:0;padding:0;color:inherit;font:inherit;
  letter-spacing:inherit;cursor:pointer;opacity:1}
.wl-hd .nv button:hover{text-decoration:underline}
.wl-hd .me{margin-left:auto;font-size:11px;opacity:.9}
.wl-sub{background:#D5DCE3;border:1px solid var(--line);border-top:0;padding:4px 12px;
  font-size:11px;color:var(--ink-soft)}
.wl-body{background:#fff;border:1px solid var(--line);border-top:0;padding:12px 14px}
.wl-title{font-size:15px;font-weight:600;margin-bottom:2px}
.wl-meta{font-size:11px;color:var(--ink-soft);margin-bottom:12px;
  border-bottom:1px solid var(--line-soft);padding-bottom:8px}
.rp{display:flex;gap:10px;padding:7px 0;border-bottom:1px dotted #E3E8EC}
.rp:last-child{border-bottom:0}
.rp .f{width:52px;flex:none;padding-left:5px;font-family:"Courier New",monospace;
  font-size:11px;color:#98A3AD}
.rp .u{width:100px;flex:none;font-size:11px;line-height:1.4;padding-top:1px}
.rp .u .nm{display:block;font-size:12.5px;color:var(--ink)}
.rp .u .uid{display:block;font-size:9.5px;color:#A2AAB2;font-family:"Courier New",monospace}
.rp .c{flex:1;font-family:"MingLiU","SimSun",serif;font-size:14px;white-space:pre-wrap;line-height:1.9}
.rp.del .c{font-style:italic;color:#A2A9AF;font-family:inherit;font-size:12px}
.rp.mine{background:#EEF3F8;box-shadow:inset 3px 0 0 var(--board)}
.rp.mine .u .nm{font-weight:700;color:var(--board-dark)}
.rp.mine .u .me{font-weight:400;font-size:9px;color:var(--board-dark);margin-left:2px}
.rp.restored{background:#FBF7EF;box-shadow:inset 3px 0 0 var(--warm)}
.rp.restored .u::after{content:'　已還原';font-size:9px;color:var(--warm);font-weight:400}
.rp .t{width:78px;flex:none;text-align:right;font-size:10px;color:#98A3AD;
  font-family:"Courier New",monospace;padding-top:3px;white-space:nowrap}
.silence{text-align:center;font-size:11px;color:#A2A9AF;padding:10px 0;letter-spacing:.12em;
  font-family:"Courier New",monospace}

/* 板首頁 */
.idx-list{padding:2px 0}
.idx-row{display:block;width:100%;text-align:left;background:none;border:0;
  border-bottom:1px solid var(--line-soft);padding:9px 4px;font-size:13px}
.idx-row:last-child{border-bottom:0}
.idx-row .t{color:var(--link);text-decoration:underline}
.idx-row .m{font-size:11px;color:#98A3AD;font-family:"Courier New",monospace;margin-top:2px;
  white-space:pre}
.idx-row:hover{background:#F4F8FB}
.idx-row.new .t::after{content:'　new';color:#8C3A3A;font-size:9px;text-decoration:none}
.idx-row.deco{cursor:default;opacity:.6}
.idx-row.deco:hover{background:none}
.idx-row.deco .t{color:var(--ink);text-decoration:none}

/* ===== Yahoo 信箱 ===== */
.vp-yahoo{background:#fff;padding:0}
.yh-top{background:#7B0099;color:#fff;padding:9px 14px;display:flex;align-items:center;gap:12px}
.yh-top .lg{font-size:19px;font-weight:700}
.yh-top .lg em{font-style:normal;color:#FFD9FF}
.yh-top .acct{margin-left:auto;font-size:11px;opacity:.85}
.yh-bar{background:#F1E4F7;border-bottom:1px solid #D9BEE6;padding:5px 14px;
  font-size:11px;color:#5C3A6B}
.yh-wrap{display:flex;min-height:60vh}
.yh-side{width:150px;flex:none;background:#FAF4FC;border-right:1px solid #E4D2EC;padding:10px 0}
.yh-side .f{padding:5px 14px;font-size:12px;color:#4A2B57}
.yh-side .f.on{background:#E9D4F2;font-weight:600}
.yh-main{flex:1;min-width:0;padding:14px 18px}
@media(max-width:700px){.yh-wrap{display:block}.yh-side{width:auto;display:flex;flex-wrap:wrap;
  border-right:0;border-bottom:1px solid #E4D2EC}}
.yh-subj{font-size:17px;color:#2B1533;margin-bottom:10px}
.mhead{font-size:12px;line-height:1.95;border-top:1px solid #E4D2EC;border-bottom:1px solid #E4D2EC;
  padding:9px 0;margin-bottom:14px;color:#4A3A52}
.mhead b{color:#7B0099;display:inline-block;width:52px}
.mbody{font-family:"MingLiU","SimSun",serif;font-size:14.5px;line-height:2.05;white-space:pre-wrap}
.yh-side .f{cursor:pointer;display:flex;align-items:center}
.yh-side .f .n{margin-left:auto;color:#8A6B99;font-size:11px}
.yh-side .f:hover{background:#F3E8F8}
.yh-listhd{font-size:13px;color:#5C3A6B;border-bottom:1px solid #E4D2EC;
  padding-bottom:7px;margin-bottom:4px;letter-spacing:.06em}
.yh-list{width:100%;border-collapse:collapse;font-size:13px}
.yh-list tr{cursor:pointer;border-bottom:1px solid #F0E6F5}
.yh-list tr:hover{background:#FAF4FC}
.yh-list tr.ur .sb{font-weight:700;color:#2B1533}
.yh-list td{padding:8px 6px;vertical-align:top}
.yh-list .fr{width:88px;color:#5C3A6B;font-family:"Courier New",monospace;font-size:12px}
.yh-list .sb{color:#22282E}
.yh-list .clip{font-size:11px}
.yh-list .dt{width:86px;text-align:right;color:#98A3AD;font-size:11px;
  font-family:"Courier New",monospace}
.yh-empty{padding:30px 0;text-align:center;color:#A2A9AF;font-size:12px}
.yh-back{background:none;border:0;color:var(--link);font-size:12px;
  text-decoration:underline;padding:0;margin-bottom:12px}
.yh-att{margin-top:18px;padding-top:12px;border-top:1px solid #E4D2EC;
  font-size:12px;color:#5C3A6B}
.yh-att .a{color:var(--link);text-decoration:underline;font-family:"Courier New",monospace}
.yh-att button.a{background:none;border:0;padding:0;font-size:12px}

/* ===== 即時通存檔（裸 HTML） ===== */
.vp-archive{background:#fff;padding:0}
.ar{max-width:700px;padding:18px 22px;
  font-family:"Times New Roman","PMingLiU",serif;color:#000}
.ar h1{font-size:19px;color:#000080;margin:0 0 2px}
.ar .sub{font-size:12px;margin-bottom:10px}
.ar hr{border:0;border-top:1px solid #808080;margin:10px 0}
.ar .day{font-size:14px;font-weight:700;color:#000080;margin:16px 0 4px}
.ar table{border-collapse:collapse;width:100%}
.ar td{padding:1px 0;vertical-align:top;font-size:14px;line-height:1.7}
.ar td.n{width:54px;color:#000080;white-space:nowrap;padding-right:8px}
.ar td.n.her{color:#800040}
.ar .foot{font-size:11px;color:#808080;margin-top:20px}

/* ===== 板務後台 ===== */
.vp-admin{background:#C8CCD0;
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.14) 0 2px,transparent 2px 4px)}
.ad{max-width:500px;margin:5vh auto 0;background:#D4D8DC;border:2px outset #EDEFF1;padding:2px}
.ad .ttl{background:#4A5560;color:#fff;font-size:12px;padding:3px 8px;letter-spacing:.1em}
.ad .in{padding:16px 18px}
.ad h2{margin:0 0 3px;font-size:15px;color:#2C3E50}
.ad .sub{font-size:11px;color:var(--ink-soft);letter-spacing:.1em;margin-bottom:14px}
.ad.wide{max-width:600px}
.ad .rst{width:100%;border-collapse:collapse;font-size:12px;margin:2px 0 14px}
.ad .rst th{text-align:left;font-weight:600;color:var(--ink-soft);font-size:11px;
  letter-spacing:.06em;border-bottom:1px solid #8A949D;padding:4px 6px}
.ad .rst td{padding:7px 6px;border-bottom:1px solid #C0C6CC}
.ad .rst tr:hover td{background:#E7EAED}
.ad .rst tr[data-rid]{cursor:pointer}
.ad .rst .w{font-family:"Courier New",monospace;color:var(--ink-soft);white-space:nowrap}
.ad .rst-none{font-size:12px;color:var(--ink-soft);padding:14px 0}
.ad .ok{font-size:12px;color:#3A6B3A;min-height:19px;margin-top:9px;white-space:pre-wrap}

/* ===== 搜尋 ===== */
.vp-search{background:#fff;padding:0}
.se{max-width:520px;margin:12vh auto 0;padding:0 20px;text-align:center}
.se .lg{font-size:30px;letter-spacing:.04em;color:#4A6D8C;margin-bottom:22px;
  font-family:"MingLiU","SimSun",serif}
.se input{width:100%;padding:9px 12px;border:1px solid #A6ADB4;border-radius:2px;
  font-size:15px;color:var(--ink)}
.se input:focus{outline:2px solid var(--board);outline-offset:-1px}
.se .acts{margin-top:16px}
.se .msg{font-size:12px;color:#8C3A3A;min-height:20px;margin-top:10px}
.se .res{text-align:left;margin-top:26px;border-top:1px solid var(--line-soft);padding-top:16px}
.se .res .r{margin-bottom:16px}
.se .res .r .t{color:var(--link);font-size:15px;text-decoration:underline}
.se .res .r .u{color:#3A7A3A;font-size:11px;font-family:"Courier New",monospace}
.se .res .r .d{font-size:12px;color:var(--ink-soft);margin-top:2px}

/* ===== 部落格 ===== */
.vp-blog{background:#F3F1EC;padding:0}
.bl{max-width:620px;margin:0 auto;padding:26px 22px 60px}
.bl-hd{border-bottom:2px solid #C4BCA8;padding-bottom:14px;margin-bottom:26px}
.bl-hd h1{margin:0;font-size:22px;color:#4A4236;font-family:"MingLiU","SimSun",serif;
  letter-spacing:.05em;font-weight:400}
.bl-hd .d{font-size:11px;color:#8A8272;margin-top:5px;letter-spacing:.08em}
.bl-post{margin-bottom:34px;padding-bottom:24px;border-bottom:1px dotted #C4BCA8}
.bl-post:last-child{border-bottom:0}
.bl-post .dt{font-size:11px;color:#8A8272;font-family:"Courier New",monospace;
  letter-spacing:.06em;margin-bottom:6px}
.bl-post .ti{font-size:15px;color:#4A4236;margin-bottom:8px;font-weight:600}
.bl-post .bd{font-family:"MingLiU","SimSun",serif;font-size:14.5px;line-height:2.1;
  color:#3A342B;white-space:pre-wrap}
.bl-gap{text-align:center;font-size:11px;color:#A89E88;padding:20px 0;
  font-family:"Courier New",monospace;letter-spacing:.1em}
.bl-foot{text-align:center;font-size:11px;color:#A89E88;margin-top:30px;line-height:2}

/* ===== 表單（共用） ===== */
.form .note{font-size:11px;color:var(--ink-soft);line-height:1.8;margin-bottom:14px;white-space:pre-wrap}
.form label{display:block;font-size:12px;margin-bottom:3px}
.form input{width:100%;padding:7px 9px;margin-bottom:12px;border:1px solid #8A949D;background:#fff;
  font-family:"Courier New",monospace;font-size:15px;color:var(--ink)}
.form input:focus{outline:2px solid #2F6FB0;outline-offset:-1px}
.form input[readonly]{color:var(--ink-soft);background:#F1F3F5;cursor:default}
.form .remember{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-soft);
  margin:-6px 0 13px}
.form .remember input{width:auto;margin:0;padding:0}
.form .linklike{background:none;border:0;color:var(--link);font-size:12px;text-decoration:underline;
  padding:0;margin:-4px 0 14px;display:inline-block;cursor:pointer}
.form .hintq{background:#F7F9FA;border:1px solid var(--line);padding:10px 12px;margin:-4px 0 14px}
.form .hintq-t{font-size:11px;color:var(--ink-soft);margin-bottom:4px}
.form .hintq-q{font-size:13px;color:var(--ink);font-weight:600}
.form .msg{font-size:12px;color:#8C3A3A;min-height:19px;margin-top:9px}
.sysbox{max-width:390px;margin:6vh auto 0}
.sysbox .brandline{font-size:23px;font-weight:700;margin-bottom:2px}
.sysbox .subline{font-size:11px;letter-spacing:.08em;margin-bottom:18px;color:var(--ink-soft)}
.sysbox .box{background:#fff;border:1px solid #A6ADB4;padding:20px}
.vp-yahoo .sysbox .brandline{color:#7B0099}
.vp-yahoo .sysbox .box{border-top:3px solid #7B0099}

/* ===== 頁面欄寬 ===== */
.cols{max-width:640px;margin:0 auto}
.main{width:100%}

/* ===== 我的最愛 ===== */
.vp-notes{background:#EDEFF1;padding:0}
.nt{max-width:620px;margin:0 auto;padding:26px 22px 60px}
.nt-hd{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--line);
  padding-bottom:12px;margin-bottom:20px}
.nt-hd .star{color:#C9A227;font-size:19px}
.nt-hd h1{margin:0;font-size:19px;font-weight:600;letter-spacing:.06em;color:var(--ink)}
.card{background:var(--panel);border:1px solid var(--line);margin-bottom:12px}
.card h2{margin:0;font-size:12px;font-weight:600;letter-spacing:.1em;background:#D5DCE3;
  border-bottom:1px solid var(--line);padding:5px 10px}
.doc{display:block;width:100%;text-align:left;background:none;border:0;
  border-bottom:1px solid var(--line-soft);padding:8px 10px;font-size:12px;line-height:1.6}
.doc:last-child{border-bottom:0}
.doc:hover{background:#F4F8FB}
.doc .t{color:var(--link);text-decoration:underline}
.doc .m{font-size:10px;color:#98A3AD;font-family:"Courier New",monospace}
.doc.new .t::after{content:'　new';color:#8C3A3A;font-size:9px;text-decoration:none}
.doc.lock{cursor:default;opacity:.72}
.doc.lock:hover{background:none}
.doc.lock .t{color:#98A3AD;text-decoration:none}
.doc.lock .t::before{content:'🔒 ';font-size:10px}
.doc.lock .m{color:#B0B7BE}
.step{padding:8px 10px;font-size:12px;border-bottom:1px solid var(--line-soft)}
.step:last-child{border-bottom:0}
.step.done{color:#9AA4AD}
.step.now{background:#F4F8FB}
.step .mk{font-family:"Courier New",monospace;color:#9AA4AD;margin-right:6px}
.step.done .mk{color:var(--board)}
.step.now .mk{color:#8C6A3A}
.step.future{color:#B0B7BE}
.step.future .mk{color:#C4CAD0}
.step .sub{font-size:11px;color:var(--ink-soft);margin:4px 0 0 20px;line-height:1.7}
.gotab{display:block;width:100%;text-align:left;background:none;border:0;
  border-top:1px solid var(--line-soft);padding:8px 10px;font-size:12px;color:var(--link);
  text-decoration:underline}
.gotab:hover{background:#F4F8FB}

/* ===== 過場旁白 ===== */
.vp-said{background:#1C1F23;padding:0}
.said{max-width:520px;margin:0 auto;padding:20vh 24px 30vh;text-align:center;
  font-family:"MingLiU","SimSun",serif;font-size:16px;line-height:2.3;color:#D6DBE0}
.said p{margin:0 0 34px;white-space:pre-wrap;opacity:0;animation:fin 1.2s ease forwards}
.said .btn{background:none;border:1px solid #4A5560;color:#9AA4AD;padding:7px 26px;
  font-size:12px;letter-spacing:.16em;opacity:0;animation:fin 1s ease forwards;animation-delay:1.3s}
.said .btn:hover{background:#262B31;color:#D6DBE0}
@media (prefers-reduced-motion:reduce){.said p,.said .btn{opacity:1;animation:none}}

/* ===== 終幕 ===== */
.vp-end{background:#1C1F23;padding:0}
.end{max-width:520px;margin:0 auto;padding:16vh 24px 20vh;
  font-family:"MingLiU","SimSun",serif;font-size:16px;line-height:2.4;color:#D6DBE0}
.end p{margin:0 0 26px;opacity:0;animation:fin 1.4s ease forwards}
.end p:nth-child(2){animation-delay:1.6s}
.end p:nth-child(3){animation-delay:3.4s}
.end p:nth-child(4){animation-delay:5.6s}
.end .q{color:#fff;font-size:18px}
.end .sig{font-size:11px;color:#6E7A85;font-family:"Courier New",monospace;
  letter-spacing:.14em;margin-top:40px;animation-delay:7.4s}
@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.end p{opacity:1;animation:none}}
/* ===== 手機／窄螢幕 =====
   固定寬的樓層欄（52px）＋暱稱欄（100px）＋時間欄（78px）在手機上會把內文擠成
   一行三、四個字。窄螢幕改成上下兩段：樓層／暱稱／時間縮成一條標頭，內文自己佔一整行。 */

   date:'2015/04/13 12:48',subj:'五樓開好了',
   body:'弄好了，網址在下面。\n\nhttp://wulou.5gbfree.com/\n\n你們的帳號我照英文名字開好了，密碼先都設你們的生日，登進去自己改。\n\n板務後台的帳號是 ytl_lin，密碼 5f2015。\n我怕我哪天請假你們要用，先跟你們講一聲，不要外流。\n\n板名我取「五樓」，因為就是我們那層樓。宗翰說沒創意，可是我想不到更好的。\n\n以後閒聊都可以貼這裡。公司內網有在看，這裡沒有。'},
  {id:'yalin_hr',box:'in',at:1,
   from:'yalin_w',fromFull:'yalin.wang@shengyue.com.tw',
   date:'2015/10/05 14:47',subj:'張副理',
   body:'妳要的資料我查到了。\n\n張O瑋，副理，管理部\n2015/08/17 到職那批的直屬主管\n\n附件是名冊，不要外流喔哈哈。\n\n有需要再跟我說，我這邊調資料很快。',

  {id:'siyu_draft1',box:'draft',at:1,
   date:'2015/10/15 01:32',subj:'（無主旨）',
   to:'周映柔',toFull:'yr.chou@shengyue.com.tw',
   body:'映柔\n\n我知道妳現在應該不會想理我，但我想跟妳說一件事，跟阿哲沒關係，是我自己想講的。\n\n昨天妳說我是唯一會聽妳說話的人的時候，我在螢幕前面愣了滿久的。\n不是因為妳講得多重，是因為我發現我聽到那句話的時候，是真的開心。\n不是那種「任務完成」的開心，是真的、很單純地覺得——有人這麼需要我講的話。\n\n我後來想了很久，那種開心到底哪裡不對勁。\n我想通了，但想通之後更難受。\n\n我從國中就是那種在班上不太有人記得名字的人。\n出社會之後也是，開會沒人會第一個問我意見，聚餐我坐哪都可以。\n我沒有不快樂，我只是習慣了自己對誰都不是最重要的那個。\n\n然後妳出現了，妳把最累、最說不出口的事情都講給「阿哲」聽，\n妳說沒有人像他這樣聽妳說話——\n我知道那個人不是真的，可是打字的手是我的，聽的也是我。\n那三個月，我第一次覺得自己對某個人來說，是重要的。\n\n我一直在想要不要跟妳說，其實'},
  {id:'siyu_sent1',box:'sent',at:3,
   date:'2015/12/02 21:05',subj:'保重',
   to:'林昱庭',toFull:'ytl@shengyue.com.tw',
   body:'昱庭\n\n聽說你這禮拜辦離職了。\n\n之前的事謝謝你，不知道該怎麼講比較好，\n總之你保重，有機會再約吃飯。\n\n思妤'},
  {id:'kt_backup1',box:'in',at:3,

  {id:'ytl',box:'trash',at:3,
   from:'ytl_lin',fromFull:'ytl@shengyue.com.tw',
   date:'2015/11/20 22:47',subj:'（無主旨）',
   unread:1,
   body:'思妤\n\n生日快樂。板上那句我打得太短了。\n\n10/14 那天是我。\n\n她跟我講了一件事，我聽完之後在座位上坐了很久。\n我本來以為我們只是在鬧她。\n\n那個帳號我沒有真的停用。我跟大家說停了，其實我只是改了密碼。\n我不知道要怎麼解釋，我只是覺得不能就這樣放著不管。\n\n她後來傳了一些照片給阿哲。\n我去找過她了。\n\n禮拜一我在板上說要收，我沒辦法在那裡講為什麼。\n禮拜二晚上文豪講的那個，我擋下來了。\n可是這樣下去不行，我遲早要把整件事講清楚。\n\n如果到時候他們還是不肯聽，我就自己去講。\n\n妳幫我一次好嗎'}

function curGate(){
  if(prog===0) return GATES[0];          // g_mail
  if(prog===1) return GATES[1];          // g_ytl（登入板務後台）
  if(prog===2) return GATES[2];          // g_admin（還原）
  if(prog===3||prog===4) return GATES[3];// g_search

}
/* 板務後台可以還原的東西：已解鎖的串裡，還沒被還原的刪除樓層 */
function restorables(){
  const out=[];
  DOCS.forEach(d=>{
    if(d.skin!=='wulou'||prog<d.at) return;
    d.posts.forEach(p=>{ if(p.rid&&p.del&&!restored.has(p.rid))
      out.push({rid:p.rid,title:d.title,when:p.rdel.when,by:p.rdel.by,ts:p.rdel.ts}); });
  });
  return out.sort((a,b)=>b.ts-a.ts);
}
function availDocs(){ return DOCS.filter(d=>prog>=d.at); }
function isBoardDoc(id){ if(id==='board_index') return true;
  const d=DOCS.find(x=>x.id===id); return !!d&&d.skin==='wulou'; }

/* ================= 分頁 ================= */
function syncTabs(){
  const keep=tabs.filter(t=>t.kind==='doc'&&!isBoardDoc(t.id)
    &&prog>=(DOCS.find(d=>d.id===t.id)||{at:99}).at);
  /* 茶水間永遠釘在第一格、關不掉——遊戲的「今天」都在那裡發生 */
  tabs=[{id:'chat',kind:'chat'},{id:boardTab,kind:'board'}].concat(keep);
  const g=curGate();
  if(g&&!gateDone[g.id]) tabs.splice(2,0,{id:g.id,kind:'gate'});
  if(NOTES_TAB_ENABLED) tabs.splice(g&&!gateDone[g.id]?3:2,0,{id:'notes',kind:'notes'});
  if(prog>=6) tabs=[{id:'end',kind:'end'}];
  if(!tabs.some(t=>t.id===active)) active=boardTab;
}
function openTab(id){
  if(!tabs.some(t=>t.id===id)){
    const docs=tabs.filter(t=>t.kind==='doc');
    if(docs.length>=MAX_DOC_TABS){
      const oldest=docs[0].id;
      tabs=tabs.filter(t=>t.id!==oldest);
      hist=hist.filter(h=>h!==oldest);
    }
    tabs.push({id,kind:'doc'});
  }
  go(id);
}
/* 開啟一份文件：五樓站內的串（含首頁）留在同一個分頁切換，其他站台才開新分頁 */
function openDoc(id){
  seen.add(id);
  if(isBoardDoc(id)){ boardTab=id; go(id); }
  else openTab(id);
}
function goHome(){ boardTab='board_index'; go('board_index'); }
function closeTab(id){ tabs=tabs.filter(t=>t.id!==id); if(active===id) goHome(); else render(); }
function go(id){ if(active!==id) hist.push(active); active=id;
  if(id==='chat') hideToast();
  render(); window.scrollTo(0,0); }
function back(){ if(!hist.length)return; const p=hist.pop();
  if(isBoardDoc(p)) boardTab=p;
  active=tabs.some(t=>t.id===p)||isBoardDoc(p)?p:tabs[0].id; render(); window.scrollTo(0,0); }

/* ================= 茶水間：播放器 =================
   同一份 CHAT 資料，登入前畫在 #prelude 裡、登入後畫在 chat 分頁裡。
   不在聊天室的時候不播——訊息先排在佇列裡、分頁跳未讀數並彈通知，
   玩家切回來才「現場」一句一句冒出來，這樣每一段都不會被錯過。 */
let chatShown=[];          // 已經出現在畫面上的訊息
let chatQueue=[];          // 還沒播的步驟
let chatTyping=null;       // 正在「輸入中」的人
let chatDraft=null;        // 等玩家點下去的草稿泡泡
let chatBusy=false;        // 有 timer 在跑
let toastT=null;
const chatFired=new Set(); // 已經排進佇列的段落
const chatDone=new Set();  // 已經播完的段落

const chatHere=()=>!loggedIn||(active==='chat'&&!saidNow&&prog<6);
/* 分頁上要跳的未讀數：只算「輪到玩家講話之前」的那幾則，不預告後面還有多少 */
function chatPending(){ let n=0;
  for(const st of chatQueue){ if(st._done) continue; if(st.me!==undefined) break; n++; }
  return n; }

/* 掃一次所有段落，把條件成立的依序排進佇列（不插隊） */
function chatCheck(){
  let added=false;
  CHAT.forEach(sc=>{
    if(chatFired.has(sc.id)||!sc.when()) return;
    chatFired.add(sc.id);
    chatQueue=chatQueue.concat(sc.steps,[{_done:sc.id}]);
    added=true;
  });
  if(added&&!chatHere()){ showToast(); if(loggedIn) renderChrome(); }  // 分頁上的未讀數也要立刻跳出來
  chatPump();
}
function chatPump(){ if(chatBusy||chatDraft||!chatQueue.length||!chatHere()) return;
  chatBusy=true; chatNext(); }
function chatNext(){
  if(!chatQueue.length){ chatBusy=false; chatCheck(); return; }
  if(!chatHere()){ chatBusy=false; return; }        // 玩家走開了，剩下的等他回來
  const st=chatQueue[0];
  if(st._done){ chatQueue.shift(); chatBusy=false; chatDone.add(st._done); chatCheck(); return; }
  if(st.me!==undefined){ chatQueue.shift(); chatBusy=false; chatDraft=st; chatPaint(); return; }
  chatQueue.shift();
  const reveal=()=>{ chatShown.push(st); chatPaint();
    if(st.now) chatNext(); else setTimeout(chatNext,st.sys?320:450); };
  if(st.now) return reveal();                        // 開場墊場：整段直接出現
  if(st.sys||st.u===ME.uid) return void setTimeout(reveal,600);
  chatTyping=st.u; chatPaint();                      // 別人講話才有「輸入中」
  setTimeout(()=>{ chatTyping=null; reveal(); },900+Math.random()*500);
}
/* 玩家點下草稿泡泡＝思妤把那句話送出去 */
function chatSend(){
  const st=chatDraft; if(!st) return;
  chatDraft=null; chatShown.push({u:ME.uid,c:st.me}); chatPaint();
  if(st.end){ prog=6; setTimeout(()=>{ render(); window.scrollTo(0,0); },1100); return; }
  chatBusy=true; setTimeout(chatNext,500);
}

function plAvatar(u){ const a=AVATARS[u]||{ch:who(u)[0]||'?',bg:'#8A9299'};
  return `<div class="pl-av" style="background:${a.bg}">${esc(a.ch)}</div>`; }
function plRow(u,inner,extraCls){
  const mine=u===ME.uid;
  return `<div class="pl-row${mine?' me':' other'}${extraCls?' '+extraCls:''}">
    ${plAvatar(u)}<div class="pl-col">
      ${mine?'':`<div class="pl-name">${esc(who(u))}</div>`}
      ${inner}</div></div>`;
}
function chatCard(m){
  if(m.url) return `<button class="pl-link" data-login="1">
    <span class="lbl">${esc(m.lbl||'連結')}</span>
    <span class="url">${esc(m.url)}</span></button>`;
  const d=DOCS.find(x=>x.id===m.share)||{}, st=SITE[m.share]||{};
  return `<button class="pl-link" data-share="${esc(m.share)}">
    <span class="lbl">${esc(d.site||'')}</span>
    <span class="tt">${esc(d.title||'')}</span>
    <span class="url">${esc(st.url||'')}</span></button>`;
}
function chatRows(){
  const rows=chatShown.map(m=>{
    if(m.sys) return `<div class="pl-sys">${esc(m.sys)}</div>`;
    if(m.url||m.share) return plRow(m.u,chatCard(m));
    return plRow(m.u,`<div class="pl-bub">${esc(m.c)}</div>`);

function renderChrome(){
  const strip=document.getElementById('tabstrip');

  strip.innerHTML='';
  tabs.forEach(t=>{
    const s=SITE[t.id]||{};

    el.className='tab'+(active===t.id?' on':'');
    const unread=t.kind==='chat'&&active!=='chat'?chatPending():0;
    el.innerHTML=`<span class="fav" style="background:${s.fav||'#8A9299'}"></span>`
      +`<span class="tt">${esc(s.tab||t.id)}</span>`
      +(unread?`<span class="bd">${unread}</span>`:'')

function renderGate(vp,g){
  const f=g.fields.map((x,i)=>
    `<label for="f${i}">${esc(x.label)}</label>
     <input id="f${i}" type="${x.type==='password'?'password':'text'}"
      autocomplete="off" spellcheck="false"
      ${x.prefill?`value="${esc(x.prefill)}"`:''}${x.locked?' readonly':''}>`
    +(x.remember?`<label class="remember"><input type="checkbox" checked disabled>記住我的帳號</label>`:''))
   .join('');
  const forgotHtml=g.forgot?`<button type="button" class="linklike" id="forgotBtn">忘記密碼？</button>
    <div class="hintq" id="hintBox" hidden><div class="hintq-t">密碼提示問題</div>
      <div class="hintq-q">${esc(g.forgot.hint)}</div></div>`:'';
  const form=`<div class="form">${g.note?`<div class="note">${esc(g.note)}</div>`:''}${f}${forgotHtml}
    <button class="btn wide" id="gsub">送出</button><div class="msg" id="gmsg"></div></div>`;

  if(g.skin==='admin'){
    vp.innerHTML=`<div class="ad"><div class="ttl">${esc(g.brand[0])}</div>
      <div class="in"><h2>還原已刪除文章</h2><div class="sub">${esc(g.brand[1])}</div>
      ${form}</div></div>`;
  } else if(g.skin==='search'){
    vp.innerHTML=`<div class="se">
      <div class="lg">搜尋</div>
      <input id="f0" autocomplete="off" spellcheck="false" placeholder="">
      <div class="acts"><button class="btn" id="gsub">搜尋</button></div>
      <div class="msg" id="gmsg"></div>
      <div id="sres"></div></div>`;
  } else {
    vp.innerHTML=`<div class="yh-top"><span class="lg">YAHOO!<em>奇摩</em></span>
        <span style="font-size:12px">登入</span></div>
      <div class="sysbox"><div class="brandline">${esc(g.brand[0])}</div>
      <div class="subline">${esc(g.brand[1])}</div><div class="box">${form}</div></div>`;
  }

  setTimeout(()=>{
    const msg=document.getElementById('gmsg');
    const submit=()=>{
      const vals=g.fields.map((x,i)=>(document.getElementById('f'+i)||{}).value||'');
      const ok=g.fields.every((x,i)=>x.locked||match(vals[i],x.answer));
      if(!ok){
        if(msg){
          let t=g.err;
          if(g.nudge) for(const k in g.nudge) if(vals.some(v=>norm(v)===norm(k))) t=g.nudge[k];
          msg.textContent=t;
        }
        return;
      }

      if(g.id==='g_search'){ showSearchResult(); return; }
      gateDone[g.id]=true;
      prog=AFTER[g.id].unlockAt;
      saidNow=AFTER[g.id].said||'';
      if(g.id==='g_mail'){                 // 登入成功 → 留在信箱
        mailFolder='in'; mailOpen=null;
        seen.add('m_box'); openTab('m_box');
      } else if(g.id==='g_ytl'){           // 登入板務後台 → 人就留在後台，接著還原
        go('g_admin');
      } else {
        goHome();
      }
    };
    const b=document.getElementById('gsub'); if(b)b.onclick=submit;
    g.fields.forEach((x,i)=>{const el=document.getElementById('f'+i);
      if(el)el.onkeydown=e=>{if(e.key==='Enter')submit();};});
    const fb=document.getElementById('forgotBtn');
    if(fb) fb.onclick=()=>{
      const hb=document.getElementById('hintBox'); if(hb)hb.hidden=false;
      fb.hidden=true;
      const pwIdx=g.fields.findIndex(x=>x.type==='password');
      const pw=document.getElementById('f'+(pwIdx<0?0:pwIdx)); if(pw)pw.focus();
    };
    const firstIdx=g.fields.findIndex(x=>!x.locked);
    const first=document.getElementById('f'+(firstIdx<0?0:firstIdx)); if(first)first.focus();
  },0);
}

/* ---------- 我的最愛 ---------- */
function notesContent(){
  const g=curGate();
  const ahead=DOCS.filter(d=>d.at>prog&&d.peek).map(d=>d.at);
  const nextAt=ahead.length?Math.min(...ahead):-1;   // 只預告下一階，不把整條線一次攤開
  const docs=DOCS.map(d=>{
    if(prog>=d.at) return `<button class="doc${seen.has(d.id)?'':' new'}" data-doc="${d.id}">
      <div class="t">${esc(d.title)}</div><div class="m">${esc(d.site)}</div></button>`;
    if(d.peek&&d.at===nextAt) return `<div class="doc lock">
      <div class="t">${esc(d.lockTitle||d.title)}</div><div class="m">${esc(d.peek)}</div></div>`;
    return '';
  }).join('');
  const gi=g?GATES.findIndex(x=>x.id===g.id):GATES.length;
  const steps=GATES.map((x,i)=>{
    const done=!!gateDone[x.id];
    const now=g&&g.id===x.id;
    if(i>gi) return `<div class="step future"><span class="mk">□</span>${esc(x.ch)}　？？？</div>`;
    return `<div class="step${done?' done':''}${now?' now':''}">
      <span class="mk">${done?'■':'□'}</span>${esc(x.ch)}　${esc(x.label)}
      ${now?`<div class="sub">${esc(x.need)}</div>`:''}</div>`;
  }).join('');
  return `<div class="card"><h2>📁　已蒐集的資料</h2>${docs}</div>
    <div class="card"><h2>📁　待辦事項</h2>${steps}
      ${g?`<button class="gotab" id="goGate">開啟　${esc(SITE[g.id].tab)}</button>`:''}</div>`;
}
function renderNotes(vp){
  vp.innerHTML=`<div class="nt">
    <div class="nt-hd"><span class="star">★</span><h1>我的最愛</h1></div>
    ${notesContent()}
  </div>`;
  document.querySelectorAll('[data-doc]').forEach(b=>{
    b.onclick=()=>{ openDoc(b.dataset.doc); };});
  const gg=document.getElementById('goGate');
  if(gg){ const g=curGate(); if(g) gg.onclick=()=>go(g.id); }
}

/* ---------- 終幕 ---------- */
function renderEnd(vp){
  vp.className='viewport vp-end';
  vp.innerHTML=`<div class="end">
    <p>你送出了。</p>
    <p>十一年來，這是第一次有人把他的名字，<br>跟那年真正發生的事，放進同一句話裡。</p>
    <p class="q">他那天最後說的那句，聲音很輕，快得像是說給自己聽的——<br><br>
      「我也想過要這樣做。」</p>
    <p>沒有人記得這句。因為沒有人在聽。</p>
    <p class="sig">－ 五樓 －</p>
  </div>`;
}

document.getElementById('navBack').onclick=back;
document.getElementById('navRel').onclick=()=>render();

chatCheck();   // 開場那段從這裡開始播（此時還沒登入，畫在 #prelude 裡）
</script>
